<title>Remix Pinkasol !</title>
<style>
  html, body { margin: 0; height: 100%; background: #174596; overflow: hidden; }
  canvas { display: block; touch-action: none; }
  #back { position: absolute; top: 12px; left: 12px; z-index: 2; color: #fdfdfd; text-decoration: none;
    font: 800 15px/1 "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
  #back:hover { color: #dc8d4e; }
  /* the "Garder" panel: a sheet of paper over the table */
  #keep { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: rgba(23, 69, 150, .6); }
  #keep[hidden] { display: none; }
  #keep .paper { box-sizing: border-box; width: min(460px, calc(100vw - 20px)); max-height: calc(100vh - 20px); overflow: auto; background: #fdfdfd; color: #174596; padding: 18px 18px 16px;
    clip-path: polygon(1% 2%, 30% 0, 62% 1.5%, 99% 0, 100% 35%, 98.5% 70%, 100% 99%, 64% 100%, 33% 98.5%, 0 100%, 1.5% 62%, 0 28%);
    font: 700 15px/1.3 "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif; }
  #keep h2 { margin: 0 0 8px; font-size: 20px; letter-spacing: .05em; }

  #keep .msg { margin: 0 0 10px; min-height: 1.3em; }
  #keep .row { display: flex; gap: 10px; flex-wrap: wrap; }

<script>
// Pinkasol sound engine — shared by the three experiences (duo, ciel,
// collage). Plain Web Audio, no library. In a tile it is inlined by
// tools/build.py (a tile is one file); here it is /lib/pinkasol-engine.js.
//
//   const eng = await Pinkasol.engine();          // loads the manifest
//   canvas.onpointerdown = () => eng.unlock();    // first gesture: sound on
//   const v = eng.play(eng.piece('01_Rototo', 'drums'));
//   v.level(); v.stop();
//
// Time: the first bar-based loop that starts sets the CLOCK (its bar
// length, its start). Every later piece starts on the clock's next bar
// (opts.quant: 'bar' | 'half' | 'beat' | 'now'). A bar-based piece whose
// tempo is within MATCH of the clock's is resampled to it (playbackRate:
// a slight pitch shift, < 1.4 semitone); further away it plays at its own
// speed (still starting on a bar line). Rubato pieces ("free") never sync.
(function () {
  'use strict';

  const MATCH = 0.08;
  const MAX_DECODED = 24;
  const KEYS = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
  const ALIASES = { 'C#': 'Db', 'D#': 'Eb', 'F#': 'Gb', 'G#': 'Ab', 'A#': 'Bb' };

  // "G minor" -> its relative major's index on the circle of fifths
  function fifths(key) {
    const [note, mode] = String(key).split(' ');
    let i = KEYS.indexOf(ALIASES[note] || note);
    if (i < 0) return null;
    if (mode === 'minor') i = (i + 3) % 12;
    return (i * 7) % 12;
  }

  // Semitones to move key `from` so it sits with key `to`: the same key or
  // its relative ideally, else one fifth apart, with the smallest move
  // (0 when already close). "G major" -> "Ab minor": +1 ... in -5..+6
  function keyShift(from, to) {
    const [note, mode] = String(from).split(' ');
    const i = KEYS.indexOf(ALIASES[note] || note);
    if (i < 0 || fifths(to) === null) return 0;
    let best = 0, bestScore = Infinity;
    for (let n = -5; n <= 6; n++) {
      const x = fifths(`${KEYS[(i + n + 12) % 12]} ${mode}`), y = fifths(to);
      const d = Math.min(Math.abs(x - y) % 12, 12 - (Math.abs(x - y) % 12));
      // a step on the circle of fifths costs 3 semitones of shift: a big
      // transposition sounds grainy, a fifth apart is fine
      const score = d * 3 + Math.abs(n);
      if (score < bestScore || (score === bestScore && Math.abs(n) < Math.abs(best))) { best = n; bestScore = score; }
    }
    return best;
  }

  // Same key, relative major/minor, or one fifth apart
  function compatible(a, b) {
    const x = fifths(a), y = fifths(b);
    if (x === null || y === null) return true;
    const d = Math.abs(x - y) % 12;
    return Math.min(d, 12 - d) <= 1;
  }

  // Time-stretch keeping the pitch (WSOLA): `alpha` = new length / old.
  // Plain JS on the main thread (the box allows no worklet): ~50 ms for a
  // 16 s stereo part. Clean within ±15 %, a little grainy beyond
  function stretch(ctx, buf, alpha) {
    const sr = buf.sampleRate, chs = buf.numberOfChannels, inLen = buf.length;
    const N = 2048, Hs = N / 2, Ha = Hs / alpha, tol = 384, L = 384;
    const outLen = Math.ceil(inLen * alpha);
    const out = ctx.createBuffer(chs, outLen, sr);
    const ins = [], outs = [];
    for (let c = 0; c < chs; c++) { ins.push(buf.getChannelData(c)); outs.push(out.getChannelData(c)); }
    const mono = new Float32Array(inLen);
    for (let c = 0; c < chs; c++) for (let i = 0; i < inLen; i++) mono[i] += ins[c][i];
    const win = new Float32Array(N);
    for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / N);
    let prev = 0;
    for (let k = 0, at = 0; at < outLen; k++, at += Hs) {
      const nominal = Math.round(k * Ha);
      let best = Math.min(nominal, inLen - 1);
      if (k > 0) {
        // the input frame that best continues the previous one
        const natural = prev + Hs;
        let bestC = -Infinity;
        for (let d = -tol; d <= tol; d += 3) {
          const s = nominal + d;
          if (s < 0 || s + L >= inLen || natural + L >= inLen) continue;
          let c = 0;
          for (let i = 0; i < L; i += 4) c += mono[natural + i] * mono[s + i];
          if (c > bestC) { bestC = c; best = s; }
        }
      }
      for (let c = 0; c < chs; c++) {
        const x = ins[c], y = outs[c];
        for (let i = 0; i < N; i++) {
          const a = best + i, b = at + i;
          if (a >= inLen || b >= outLen) break;
          // the first frame starts at full level (the loop's first beat)
          y[b] += x[a] * (k === 0 && i < Hs ? 1 : win[i]);
        }
      }
      prev = best;
    }
    return out;
  }

  async function engine(opts = {}) {
    const base = opts.base || '/audio/pieces/';
    const manifest = opts.manifest || (await (await fetch(base + 'manifest.json')).json());
    const tracks = manifest.tracks;
    const byId = Object.fromEntries(tracks.map((t) => [t.id, t]));
    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();

    const master = ctx.createGain();
    master.gain.value = 0.7;
    const limiter = ctx.createDynamicsCompressor();
    limiter.threshold.value = -10;
    limiter.knee.value = 6;
    limiter.ratio.value = 8;
    limiter.attack.value = 0.003;
    limiter.release.value = 0.2;
    const masterAnalyser = ctx.createAnalyser();
    masterAnalyser.fftSize = 1024;
    master.connect(limiter).connect(masterAnalyser).connect(ctx.destination);

    const decoded = new Map(); // file -> Promise<AudioBuffer>
    const order = [];
    const voices = new Set();
    let clock = null; // { t0, bar, beats, tempo, track }
    let leading = null; // Promise: the clock's first piece is loading
    // Tempo matching: bar-based pieces are time-stretched (pitch kept) to
    // the clock's bar, whatever their tempo. Off: ±MATCH varispeed only
    let tempoMatch = false;
    const stretched = new Map(); // "file|alpha" -> Promise<AudioBuffer>
    // The buffer to play for `p`: stretched to `bar` (tempo matching, or
    // null) and transposed by p.semitones (stretched by the pitch ratio,
    // then played that much faster: same length, new pitch)
    function stretchedFor(p, bar) {
      const ratio = 2 ** ((p.semitones || 0) / 12);
      const alphaT = bar ? (bar * p.bars) / p.loop_end : 1;
      const alpha = alphaT * ratio;
      if (Math.abs(alpha - 1) < 0.003) return { alpha: 1, alphaT, ratio: 1, buf: load(p) };
      const key = `${p.file}|${alpha.toFixed(4)}`;
      if (!stretched.has(key)) {
        stretched.set(key, load(p).then((b) => stretch(ctx, b, alpha)));
        if (stretched.size > MAX_DECODED) stretched.delete(stretched.keys().next().value);
      }
      return { alpha, alphaT, ratio, buf: stretched.get(key) };
    }
    const matches = (p, track) => tempoMatch && clock && !p.free && track.meter === clock.beats;
    const listeners = new Set();
    const emit = () => listeners.forEach((f) => f());

    function load(piece) {
      const f = piece.file;
      if (!decoded.has(f)) {
        // manifest.urls: each file's address in the site's media library
        // (the tile build), else base + file (the playground)
        decoded.set(f, fetch((manifest.urls && manifest.urls[f]) || base + f)
          .then((r) => { if (!r.ok) throw new Error(`${f}: ${r.status}`); return r.arrayBuffer(); })
          .then((b) => ctx.decodeAudioData(b)));
        order.push(f);
        while (order.length > MAX_DECODED) {
          const old = order.shift();
          if (![...voices].some((v) => v.piece.file === old)) decoded.delete(old);
          else order.push(old);
          if (order.length > MAX_DECODED * 2) break;
        }
      }
      return decoded.get(f);
    }

    const preload = (pieces) => Promise.all(pieces.map((p) => load(p).catch(() => null)));

    function piece(trackId, inst, n = 0) {
      const list = byId[trackId]?.pieces.filter((p) => p.inst === inst && !p.free) || [];
      return list[n % Math.max(1, list.length)] || null;
    }
    const pieces = (trackId, inst) => byId[trackId]?.pieces.filter((p) => !inst || p.inst === inst) || [];
    const instruments = (trackId) => [...new Set(pieces(trackId).map((p) => p.inst))];
    const trackOf = (p) => byId[p.file.split('/')[0]];

    // The next quantised time on the clock, at least `lead` s from now
    function nextTime(quant = 'bar', lead = 0.06) {
      const now = ctx.currentTime + lead;
      if (!clock || quant === 'now') return now;
      const unit = quant === 'bar' ? clock.bar : quant === 'half' ? clock.bar / 2 : clock.bar / clock.beats;
      const k = Math.ceil((now - clock.t0) / unit - 1e-6);
      return clock.t0 + Math.max(0, k) * unit;
    }

    function play(p, o = {}) {
      if (!p) return null;
      const track = trackOf(p);
      const loop = o.loop ?? !p.free;
      const synced = !p.free && o.sync !== false;
      let rate = 1;
      if (synced && clock && track.meter === clock.beats) {
        const r = clock.tempo / track.tempo;
        if (Math.abs(r - 1) <= MATCH) rate = r;
      }
      const gain = ctx.createGain();
      gain.gain.value = 0;
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.6;
      const out = o.destination || master;
      gain.connect(analyser).connect(out);
      const td = new Uint8Array(analyser.fftSize);
      const fd = new Uint8Array(analyser.frequencyBinCount);

      const v = {
        piece: p, track, inst: p.inst, rate, loop, gain, analyser,
        playing: true, ready: false, startsAt: null, src: null, target: o.gain ?? 1, loopLen: p.loop_end,
        // where the loop starts in the buffer (a part file's lead-in, scaled
        // like the rest when stretched)
        offset: p.offset || 0,
        level() {
          analyser.getByteTimeDomainData(td);
          let s = 0;
          for (let i = 0; i < td.length; i++) { const x = (td[i] - 128) / 128; s += x * x; }
          return Math.min(1, Math.sqrt(s / td.length) * 3);
        },
        spectrum() { analyser.getByteFrequencyData(fd); return fd; },
        setGain(x, time = 0.15) {
          v.target = x;
          if (!v.ready) return; // the fade-in, when scheduled, goes to target
          // Never cancel the fade-in still to come (a start on the next bar)
          const from = Math.max(ctx.currentTime, v.startsAt + v.fadeIn);
          gain.gain.cancelScheduledValues(from);
          gain.gain.setTargetAtTime(x, from, time / 3);
        },
        stop(fade = 0.4, at) {
          if (!v.playing) return;
          v.playing = false;
          voices.delete(v);
          const t = Math.max(ctx.currentTime, at ?? ctx.currentTime);
          gain.gain.cancelScheduledValues(t);
          gain.gain.setTargetAtTime(0, t, fade / 4);
          if (v.src) v.src.stop(t + fade + 0.1);
          setTimeout(() => { try { gain.disconnect(); } catch (e) { /* gone */ } }, (t - ctx.currentTime + fade + 0.3) * 1000);
          // The clock goes when the last loop has really stopped (a stop on
          // the next bar keeps it until then: what starts meanwhile syncs)
          const later = Math.max(0, t - ctx.currentTime);
          const release = () => { if (![...voices].some((x) => x.loop && !x.piece.free)) clock = null; emit(); };
          if (later > 0.01) setTimeout(release, later * 1000); else release();
          emit();
        },
        // Seconds into the piece's loop now (for visuals), null before start
        position() {
          if (!v.startsAt || ctx.currentTime < v.startsAt) return null;
          const len = v.loopLen / v.rate;
          const t = ctx.currentTime - v.startsAt;
          return v.loop ? t % len : Math.min(t, len);
        },
      };
      voices.add(v);

      // The first bar-based loop leads; others started meanwhile wait for it
      const lead = !clock && !leading && loop && !p.free && o.sync !== false;
      const loaded = load(p);
      if (lead) leading = loaded.catch(() => null);
      Promise.all([loaded, lead ? null : synced ? leading : null]).then(async ([buf]) => {
        if (!v.playing) return;
        // Tempo matching: the stretched copy, exactly the clock's bars long;
        // a transposed piece (p.semitones): stretched by the pitch ratio and
        // played that much faster. loopLen is in the buffer's seconds
        const tempoMatched = !lead && synced && matches(p, track);
        if (tempoMatched || p.semitones) {
          const s = stretchedFor(p, tempoMatched ? clock.bar : null);
          buf = await s.buf;
          v.loopLen = p.loop_end * s.alpha;
          v.offset = (p.offset || 0) * s.alpha;
          rate = s.ratio; v.rate = rate;
          if (tempoMatched) v.stretched = s.alphaT;
          v.semitones = p.semitones || 0;
          if (!v.playing) return;
        }
        const src = ctx.createBufferSource();
        src.buffer = buf;
        if (loop) { src.loop = true; src.loopStart = v.offset; src.loopEnd = Math.min(v.offset + v.loopLen, buf.duration); }
        src.connect(gain);
        // (not on a transposed piece: varispeed would bend its new pitch)
        if (!lead && synced && !v.stretched && !p.semitones && clock && track.meter === clock.beats) {
          const r = clock.tempo / track.tempo;
          if (Math.abs(r - 1) <= MATCH) { rate *= r; v.rate = rate; }
        }
        src.playbackRate.value = rate;
        const when = o.at != null ? Math.max(o.at, ctx.currentTime + 0.01)
          : lead ? ctx.currentTime + 0.05 : synced ? nextTime(o.quant || 'bar') : ctx.currentTime + 0.03;
        if (lead) {
          const real = v.loopLen / rate; // the loop in real seconds
          clock = { t0: when, bar: real / p.bars, beats: track.meter, tempo: track.tempo * (p.loop_end / real), track: track.id };
          leading = null;
        }
        src.start(when, v.offset);
        if (!loop) src.stop(when + (buf.duration - v.offset) / rate);
        src.onended = () => { if (v.playing && !loop) { v.playing = false; voices.delete(v); if (![...voices].some((x) => x.loop && !x.piece.free)) clock = null; emit(); } };
        v.fadeIn = o.fadeIn ?? 0.02;
        gain.gain.setValueAtTime(0, when);
        gain.gain.linearRampToValueAtTime(v.target, when + v.fadeIn);
        v.src = src; v.startsAt = when; v.ready = true;
        emit();
      }).catch((e) => { if (lead) leading = null; console.error(e); v.stop(0); });
      emit();
      return v;
    }

    // A track's part: its stems, loaded first, then started on the same
    // sample (next bar of the clock, or now when there is none; the first
    // one leads). `olds` stop at that moment. Returns the voices
    // o.immediate: now, not on the next bar: the clock restarts from this
    // moment (the first piece leads) and `olds` fade out in 30 ms. Give it
    // the whole table so every instrument restarts together
    async function playTogether(list, o = {}, olds = []) {
      list = list.filter(Boolean);
      await Promise.all(list.map((p) => load(p)));
      if (o.immediate) { clock = null; leading = null; }
      // Stretch before choosing the moment: no piece may start late. The
      // first piece leads when there is no clock (put the drums first)
      // Prepare every stretched/transposed buffer exactly as play() will
      // ask for it, before choosing the moment: no piece may start late.
      // The first piece leads when there is no clock (put the drums first)
      const head = list[0];
      const bar = clock ? clock.bar : head.loop_end / head.bars;
      const beats = clock ? clock.beats : trackOf(head).meter;
      await Promise.all(list.map((p) => {
        const leads = !clock && p === head;
        const matched = tempoMatch && !leads && !p.free && trackOf(p).meter === beats;
        return matched || p.semitones ? stretchedFor(p, matched ? bar : null).buf : null;
      }));
      const at = clock ? nextTime('bar') : ctx.currentTime + (o.immediate ? 0.04 : 0.08);
      olds.filter((v) => v && v.playing).forEach((v) => v.stop(o.fade ?? (o.immediate ? 0.03 : 0.25), at));
      return list.map((p) => play(p, { ...o, at }));
    }

    // A part of a track as pieces the engine plays: { inst: piece }
    function part(trackId, k) {
      const t = byId[trackId];
      const pt = t?.parts?.[k];
      if (!pt) return null;
      return Object.fromEntries(Object.entries(pt.files).map(([inst, file]) => [inst,
        { inst, file, loop_end: pt.loop_end, offset: pt.offset || 0, bars: pt.bars, free: false, part: k }]));
    }

    // Replace voice `old` by piece `p` on the next bar: a crossfade
    function swap(old, p, o = {}) {
      const v = play(p, o);
      if (old && old.playing) {
        const t = clock ? nextTime('bar') : ctx.currentTime;
        old.stop(o.fade ?? 0.25, t);
      }
      return v;
    }

    function level() {
      const td = new Uint8Array(masterAnalyser.fftSize);
      masterAnalyser.getByteTimeDomainData(td);
      let s = 0;
      for (let i = 0; i < td.length; i++) { const x = (td[i] - 128) / 128; s += x * x; }
      return Math.min(1, Math.sqrt(s / td.length) * 3);
    }
    const spectrumData = new Uint8Array(masterAnalyser.frequencyBinCount);
    const spectrum = () => { masterAnalyser.getByteFrequencyData(spectrumData); return spectrumData; };

    // Beat phase of the clock now: { bar: 0..1, beat: 0..1, n: beat index }
    function phase() {
      if (!clock || ctx.currentTime < clock.t0) return null;
      const t = ctx.currentTime - clock.t0;
      const beat = clock.bar / clock.beats;
      return { bar: (t % clock.bar) / clock.bar, beat: (t % beat) / beat, n: Math.floor((t % clock.bar) / beat) };
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) ctx.suspend(); else if (voices.size) ctx.resume();
    });

    return {
      ctx, tracks, byId, palette: manifest.palette,
      unlock: () => (ctx.state === 'running' ? Promise.resolve() : ctx.resume()),
      load, preload, piece, pieces, instruments, play, playTogether, part, swap, nextTime, phase, level, spectrum,
      compatible, keyShift, trackOf,
      get clock() { return clock; },
      get tempoMatch() { return tempoMatch; },
      set tempoMatch(x) { tempoMatch = !!x; },
      // Forget the clock: the next piece (or playTogether's first) leads
      resetClock() { clock = null; leading = null; },
      get voices() { return [...voices]; },
      stopAll(fade = 0.5) { [...voices].forEach((v) => v.stop(fade)); },
      onchange(f) { listeners.add(f); return () => listeners.delete(f); },
    };
  }

  window.Pinkasol = { engine, compatible, keyShift };
})();

</script>

<div id="keep" hidden>
  <div class="paper" role="dialog" aria-label="Votre combinaison">

<script>
// La table du duo — the tracks are cards. Drop one on an instrument: that
// instrument plays its stem of a PART of the track (a passage cut on bars,
// the same bars for every stem). Instruments holding the same track always
// play the same part, started together on the same sample: one track on the
// table = the passage as recorded. The strip under the instruments shows each
// track's parts where they are in the song; click one to go there (next bar).
// Click an instrument: mute / unmute it. The big button: stop / play the
// table as it is (or the space bar). The die: a random table. Only clicks
// and drags (mouse and touch). Parts are numbered in song order; a row
// offers all its song's parts, whatever instruments hold it (owner,
// 2026-11-24). A row: the instruments' icons, mute and remove buttons.
const BLUE = '#174596', PAPER = '#fdfdfd', ORANGE = '#dc8d4e', FADED = '#7f97c7', DIM = '#b9c6e2';
let INK = PAPER, INK0 = PAPER; // the instruments' paper: faded while silent or muted
// p5 wraps the name in quotes: close and reopen them to pass a fallback list
const FONT = 'Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif, "x';
// Left to right: the drums first (owner, 2026-11-22)
const INSTS = ['drums', 'piano', 'synth', 'bass'];
const NAMES = { piano: 'PIANO', drums: 'BATTERIE', synth: 'SYNTHÉ', bass: 'BASSE' };
const ARTICLE = { piano: 'le piano', drums: 'la batterie', synth: 'le synthé', bass: 'la basse' };
const DEFAULT_TRACK = '08_Pinkasol';
const HINT0 = 'Cliquez, glissez — le son arrive au premier geste';
const HINT1 = 'Glissez une carte sur un instrument · touchez-le : couper / remettre · double-clic : tout le morceau · espace : lecture / arrêt';

let eng = null, loadError = null, started = false;
// Both switches on by default (owner, 2026-11-22): tempo on the drums, the
// synth in the piano's key
let running = false, opSeq = 0, tempoOn = true, keyOn = true;
let hint = HINT0, hintUntil = 0, tempHint = '';
const VOL_MAX = 1.2;
// An instrument's spot by name (never by position: the order can change)
const spotOf = (inst) => spots.find((s) => s.inst === inst);
const spots = INSTS.map((inst, i) => ({ inst, i, track: null, part: 0, muted: false, vol: 1, voice: null, pending: 0,
  cx: 0, cy: 0, w: 0, h: 0, pulse: 0, shake: 0 }));
let cards = [];
let drag = null;
const anims = [];
let lastTap = { id: null, t: 0 };
let hatPop = -1e9; // when the random button was last pressed
const COVER = new Image(); // the Pinkasol cover, for the random button
COVER.src = "https://media.tilefolio.com/i1/medium_pinkasol_cover_h_0f5f9e0dd8.jpg.webp";
let lastSliderTap = { s: null, t: 0 };
let hintY = 0, stripY = 0, rowH = 40, pad = 10;
const buttons = { play: { x: 0, y: 0, r: 22 }, dice: { x: 0, y: 0, r: 18 }, tempo: { x: 0, y: 0, w: 0, h: 0 }, key: { x: 0, y: 0, w: 0, h: 0 } };
let chips = []; // the strip's clickable parts, rebuilt each frame
const rowBtns = []; // the strip rows' mute / remove buttons, rebuilt each frame
window.chips = chips;
window.rowBtns = rowBtns;

// ---------- rough, hand-cut shapes ----------
function jit(seed, i, amp) {
  return [(noise(seed + i * 0.37, 1.3) - 0.5) * 2 * amp, (noise(seed + i * 0.37, 7.1) - 0.5) * 2 * amp];
}
function roughShape(pts, seed, amp) {
  beginShape();
  let idx = 0;
  const step = Math.max(4, amp * 4);
  for (let i = 0; i < pts.length; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % pts.length];
    const k = Math.max(1, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / step));
    for (let j = 0; j < k; j++) {
      const [dx, dy] = jit(seed, idx++, amp);
      vertex(x1 + (x2 - x1) * j / k + dx, y1 + (y2 - y1) * j / k + dy);
    }
  }
  endShape(CLOSE);
}
function roughRect(x, y, w, h, seed, amp) {
  roughShape([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], seed, amp);
}
function roughEllipse(cx, cy, rx, ry, seed, amp, a0 = 0, a1 = TWO_PI) {
  const n = Math.max(14, Math.floor((a1 - a0) * Math.max(rx, ry) / Math.max(3, amp * 3)));
  const full = a1 - a0 >= TWO_PI - 1e-6;
  beginShape();
  for (let i = 0; i <= (full ? n - 1 : n); i++) {
    const a = a0 + (a1 - a0) * i / n;
    const d = (noise(seed + i * 0.41, 3.7) - 0.5) * 2 * amp;
    vertex(cx + Math.cos(a) * (rx + d), cy + Math.sin(a) * (ry + d));
  }
  endShape(CLOSE);
}
function star(x, y, R, seed, arms = 6) {
  const pts = [];
  for (let i = 0; i < arms * 2; i++) {
    const a = -HALF_PI + i * PI / arms + (noise(seed + i, 2.2) - 0.5) * 0.25;
    const r = (i % 2 ? R * 0.34 : R * (0.85 + noise(seed + i, 5.5) * 0.3));
    pts.push([x + Math.cos(a) * r, y + Math.sin(a) * r]);
  }
  beginShape(); pts.forEach(([a, b]) => vertex(a, b)); endShape(CLOSE);
}

// ---------- instruments (linocut silhouettes, unit r) ----------
function keys(x, y, w, h, n, seed, amp) {
  fill(BLUE); roughRect(x, y, w, h, seed, amp);
  const kw = w / n;
  fill(INK);
  for (let i = 0; i < n; i++) roughRect(x + i * kw + kw * 0.14, y + h * 0.1, kw * 0.72, h * 0.8, seed + 50 + i * 3, amp * 0.4);
  fill(BLUE);
  const pattern = [1, 1, 0, 1, 1, 1, 0];
  for (let i = 0; i < n - 1; i++) if (pattern[i % 7]) rect(x + (i + 1) * kw - kw * 0.22, y + h * 0.1, kw * 0.44, h * 0.48);
}
function drawInstrument(inst, r, seed) {
  const a = Math.max(0.8, r * 0.025);
  noStroke();
  if (inst === 'piano') {
    fill(INK);
    roughShape([[-0.95 * r, -0.62 * r], [0.95 * r, -0.62 * r], [0.95 * r, 0.42 * r], [-0.95 * r, 0.42 * r]], seed, a);
    roughRect(-0.86 * r, 0.38 * r, 0.13 * r, 0.42 * r, seed + 9, a);
    roughRect(0.73 * r, 0.38 * r, 0.13 * r, 0.42 * r, seed + 11, a);
    fill(BLUE);
    roughRect(-0.8 * r, -0.5 * r, 1.6 * r, 0.07 * r, seed + 3, a * 0.6);
    roughRect(-0.35 * r, -0.36 * r, 0.7 * r, 0.22 * r, seed + 5, a * 0.6);
    keys(-0.86 * r, 0.0 * r, 1.72 * r, 0.32 * r, 14, seed + 20, a);
  } else if (inst === 'drums') {
    fill(INK);
    roughRect(-0.79 * r, -0.7 * r, 0.045 * r, 1.5 * r, seed + 1, a * 0.5);
    roughRect(0.76 * r, -0.66 * r, 0.045 * r, 1.46 * r, seed + 2, a * 0.5);
    roughEllipse(-0.77 * r, -0.72 * r, 0.3 * r, 0.065 * r, seed + 3, a * 0.6);
    roughEllipse(0.78 * r, -0.68 * r, 0.26 * r, 0.06 * r, seed + 4, a * 0.6);
    roughEllipse(-0.42 * r, -0.28 * r, 0.24 * r, 0.21 * r, seed + 5, a);
    roughEllipse(0.4 * r, -0.3 * r, 0.22 * r, 0.19 * r, seed + 6, a);
    roughEllipse(0.66 * r, 0.18 * r, 0.22 * r, 0.1 * r, seed + 7, a);
    roughEllipse(0, 0.3 * r, 0.47 * r, 0.47 * r, seed + 8, a);
    fill(BLUE);
    roughEllipse(-0.42 * r, -0.28 * r, 0.14 * r, 0.12 * r, seed + 9, a * 0.6);
    roughEllipse(0.4 * r, -0.3 * r, 0.12 * r, 0.1 * r, seed + 10, a * 0.6);
    roughEllipse(0, 0.3 * r, 0.33 * r, 0.33 * r, seed + 11, a * 0.8);
    fill(INK);
    roughEllipse(0, 0.3 * r, 0.11 * r, 0.11 * r, seed + 12, a * 0.5);
  } else if (inst === 'synth') {
    // narrower than the piano, fewer keys, a few knobs and faders (owner,
    // 2026-11-22): the two read apart
    fill(INK);
    roughShape([[-0.8 * r, -0.22 * r], [0.8 * r, -0.42 * r], [0.8 * r, 0.42 * r], [-0.8 * r, 0.42 * r]], seed, a);
    fill(BLUE);
    // 4 knobs, each with its notch
    for (let i = 0; i < 4; i++) {
      const kx = (-0.62 + i * 0.19) * r, ky = (-0.1 - i * 0.022) * r;
      roughEllipse(kx, ky, 0.075 * r, 0.075 * r, seed + 30 + i, a * 0.4);
      push(); fill(INK); translate(kx, ky); rotate(-0.9 + i * 0.55);
      rect(-0.012 * r, -0.07 * r, 0.024 * r, 0.045 * r);
      pop();
    }
    // 4 faders: slots and their caps
    const caps = [0.35, 0.65, 0.2, 0.5];
    for (let i = 0; i < 4; i++) {
      const fx = (0.18 + i * 0.15) * r, top = (-0.33 + i * 0.012) * r, h = 0.27 * r;
      rect(fx - 0.014 * r, top, 0.028 * r, h);
      roughRect(fx - 0.05 * r, top + caps[i] * h - 0.025 * r, 0.1 * r, 0.05 * r, seed + 40 + i, a * 0.3);
    }
    keys(-0.74 * r, 0.06 * r, 1.48 * r, 0.3 * r, 12, seed + 60, a);
  } else if (inst === 'bass') {
    push();
    rotate(-0.62);
    fill(INK);
    roughRect(-0.2 * r, -0.055 * r, 1.08 * r, 0.11 * r, seed + 1, a * 0.6);
    roughShape([[0.86 * r, -0.1 * r], [1.1 * r, -0.13 * r], [1.1 * r, 0.12 * r], [0.86 * r, 0.1 * r]], seed + 2, a * 0.6);
    roughEllipse(-0.6 * r, 0.06 * r, 0.36 * r, 0.3 * r, seed + 3, a);
    roughEllipse(-0.26 * r, -0.02 * r, 0.25 * r, 0.21 * r, seed + 4, a);
    fill(BLUE);
    roughRect(-0.62 * r, -0.13 * r, 0.07 * r, 0.26 * r, seed + 5, a * 0.4);
    roughRect(-0.42 * r, -0.12 * r, 0.06 * r, 0.24 * r, seed + 6, a * 0.4);
    stroke(BLUE); strokeWeight(Math.max(0.7, r * 0.012));
    for (let k = -1.5; k <= 1.5; k++) line(-0.78 * r, k * 0.022 * r, 1.0 * r, k * 0.022 * r);
    noStroke();
    pop();
  }
}

// ---------- the ten motifs (cover vocabulary), in blue on a card ----------
function motif(k, x, y, r, seed) {
  const a = Math.max(0.6, r * 0.04);
  noStroke(); fill(BLUE);
  // Pinkasol (the 8th song): the album's own face, cut out of the cover
  // (owner, 2026-11-22); its three dots while the cover loads
  if (k % 10 === 7 && COVER.complete && COVER.naturalWidth) {
    const ctx2 = drawingContext, w = COVER.naturalWidth, h = COVER.naturalHeight, d = r * 1.9;
    ctx2.save();
    ctx2.beginPath(); ctx2.arc(x, y, d / 2, 0, Math.PI * 2); ctx2.clip();
    ctx2.drawImage(COVER, w * 0.22, h * 0.03, w * 0.5, h * 0.48, x - d / 2, y - d / 2, d, d);
    ctx2.restore();
    return;
  }
  switch (k % 10) {
    case 0: // an eye with lashes
      roughEllipse(x, y + r * 0.1, r * 0.62, r * 0.5, seed, a);
      fill(PAPER); roughEllipse(x, y + r * 0.1, r * 0.3, r * 0.26, seed + 1, a * 0.6);
      fill(BLUE); roughEllipse(x, y + r * 0.16, r * 0.12, r * 0.12, seed + 2, a * 0.4);
      for (let i = -1; i <= 1; i++) roughRect(x + i * r * 0.3 - r * 0.05, y - r * 0.72, r * 0.1, r * 0.26, seed + 3 + i, a * 0.5);
      break;
    case 1: // a half-moon
      roughEllipse(x - r * 0.25, y, r * 0.75, r * 0.75, seed, a, -HALF_PI, HALF_PI);
      break;
    case 2: // a star
      star(x, y, r * 0.85, seed);
      break;
    case 3: // a tree
      roughRect(x - r * 0.08, y - r * 0.2, r * 0.16, r * 0.9, seed, a * 0.6);
      roughShape([[x - r * 0.7, y - r * 0.8], [x - r * 0.52, y - r * 0.85], [x, y - r * 0.1], [x + r * 0.52, y - r * 0.85], [x + r * 0.7, y - r * 0.8], [x + r * 0.1, y + r * 0.1], [x - r * 0.1, y + r * 0.1]], seed + 1, a * 0.6);
      break;
    case 4: // a sun
      roughEllipse(x, y, r * 0.42, r * 0.42, seed, a);
      for (let i = 0; i < 9; i++) {
        const t = i / 9 * TWO_PI, c = Math.cos(t), s = Math.sin(t);
        roughShape([[x + c * r * 0.55 - s * r * 0.08, y + s * r * 0.55 + c * r * 0.08], [x + c * r * 0.95, y + s * r * 0.95], [x + c * r * 0.55 + s * r * 0.08, y + s * r * 0.55 - c * r * 0.08]], seed + 2 + i, a * 0.3);
      }
      break;
    case 5: // waves
      for (let j = 0; j < 3; j++) {
        const pts = [];
        for (let i = 0; i <= 12; i++) pts.push([x - r * 0.85 + i * r * 0.142, y + (j - 1) * r * 0.48 + Math.sin(i * 1.1 + j) * r * 0.1]);
        for (let i = 12; i >= 0; i--) pts.push([x - r * 0.85 + i * r * 0.142, y + (j - 1) * r * 0.48 + Math.sin(i * 1.1 + j) * r * 0.1 + r * 0.18]);
        roughShape(pts, seed + j * 9, a * 0.4);
      }
      break;
    case 6: // two hills
      roughShape([[x - r * 0.95, y + r * 0.6], [x - r * 0.35, y - r * 0.55], [x + r * 0.2, y + r * 0.6]], seed, a);
      roughShape([[x - r * 0.1, y + r * 0.6], [x + r * 0.45, y - r * 0.2], [x + r * 0.95, y + r * 0.6]], seed + 1, a);
      break;
    case 7: // three dots
      roughEllipse(x - r * 0.55, y + r * 0.2, r * 0.26, r * 0.26, seed, a);
      roughEllipse(x + r * 0.05, y - r * 0.3, r * 0.3, r * 0.3, seed + 1, a);
      roughEllipse(x + r * 0.55, y + r * 0.35, r * 0.2, r * 0.2, seed + 2, a);
      break;
    case 8: // a crescent
      roughEllipse(x, y, r * 0.75, r * 0.75, seed, a);
      fill(PAPER); roughEllipse(x + r * 0.32, y - r * 0.18, r * 0.6, r * 0.6, seed + 1, a);
      break;
    case 9: // a fish
      roughEllipse(x - r * 0.12, y, r * 0.6, r * 0.34, seed, a);
      roughShape([[x + r * 0.4, y], [x + r * 0.92, y - r * 0.38], [x + r * 0.86, y + r * 0.38]], seed + 1, a * 0.6);
      fill(PAPER); roughEllipse(x - r * 0.45, y - r * 0.06, r * 0.07, r * 0.07, seed + 2, a * 0.3);
      break;
  }
}

// ---------- compact mode (a small canvas: the tile on the wall, a phone) ----------
// Four big instruments (tap: mute), ten round song tokens (tap: the whole

// switches (they stay on), no sliders, one short line of hint
const SHORT_HINT = 'Touchez une chanson · glissez-la sur un instrument';

// Fit a text in `w`: the largest size from `max` down to 9 px, on one line,

function fitLines(str, w, max = 12) {

  const mid = s.length / 2;
  cuts.sort((a, b) => Math.abs(a[0] - mid) - Math.abs(b[0] - mid));
  for (let size = max; size >= 9; size -= 0.5) {
    textSize(size);
    if (textWidth(s) <= w) return { size, lines: [s] };
    for (const [i, n] of cuts.slice(0, 3)) {
      const a = s.slice(0, i + (n === 2 ? 1 : 0)).trim(), b = s.slice(i + n).trim();
      if (textWidth(a) <= w && textWidth(b) <= w) return { size, lines: [a, b] };
    }

}

  // every name fits its slot; a name still too long goes on two lines

  cards.forEach((c) => {

// ---------- presets: a table as a short code ----------
// "1~d07.2-p01.3-s08.4m-b0-a1": version 1; per instrument (d drums, p piano,
// s synth, b bass) the song's number (01-10, 0 = none), "." its part

function drawHint() {
  fill(PAPER); textAlign(CENTER, CENTER); textStyle(BOLD);

  let hs = Math.min(15, Math.max(12, width * 0.026));
  textSize(hs);

  if (textWidth(h) <= width - 24) return text(h, width / 2, hintY);

  const seps = [...h.matchAll(/ · | : | /g)].map((m) => m.index);

  const a = h.slice(0, at).trim(), b = h.slice(at).replace(/^ ?[·:] ?/, '').trim();

function hovering(c) {

function drawButtons() {
  const ph = eng && eng.phase();
  const beat = running && ph ? Math.pow(1 - ph.beat, 3) : 0;
  const b = buttons.play;
  const hot = !drag && dist(mouseX, mouseY, b.x, b.y) < b.r + 4;
  const R = b.r * (1 + beat * 0.06) + (hot ? 2 : 0);
  fill(PAPER);
  roughEllipse(b.x, b.y, R, R, 900, 1.4);
  fill(BLUE);
  if (running) roughRect(b.x - b.r * 0.36, b.y - b.r * 0.36, b.r * 0.72, b.r * 0.72, 910, 1);
  else roughShape([[b.x - b.r * 0.28, b.y - b.r * 0.42], [b.x + b.r * 0.46, b.y], [b.x - b.r * 0.28, b.y + b.r * 0.42]], 920, 1);
  fill(ORANGE);
  star(b.x + b.r + 4, b.y - b.r + 2, 8 * (1 + beat * 0.5), 91);
  drawTempoSwitch();
  // "Au hasard": the Pinkasol logo, the cover's tree-face with its eyes and
  // orange star, cut out of the cover (img/cover-medium.webp: in the tile,

  const d = buttons.dice;
  const dhot = !drag && dist(mouseX, mouseY, d.x, d.y) < d.r + 4;
  const since = (millis() - hatPop) / 1000;
  const lift = since < 0.45 ? Math.sin(Math.PI * since / 0.45) : 0;
  const S = d.r * 2.3 * (1 + lift * 0.18 + (dhot ? 0.05 : 0));

  translate(d.x, d.y);
  rotate(-0.08 + lift * 0.5 + (dhot ? 0.05 : 0));
  const pts = [];
  for (let i = 0; i < 16; i++) { // a hand-cut square
    const side = Math.floor(i / 4), f = (i % 4) / 4;
    const c = [[-1, -1], [1, -1], [1, 1], [-1, 1]][side], n2 = [[1, -1], [1, 1], [-1, 1], [-1, -1]][side];
    const j = (noise(960 + i, 1.7) - 0.5) * S * 0.06;

    pts.forEach(([x, y], i) => (i ? ctx2.lineTo(x * 0.9, y * 0.9) : ctx2.moveTo(x * 0.9, y * 0.9)));

    ctx2.restore();

  fill(PAPER); textSize(12); textAlign(LEFT, CENTER); textStyle(BOLD);
  if (!L.compact && d.x + d.r * 1.2 + 8 + textWidth('AU HASARD') < width - 6) text('AU HASARD', d.x + d.r * 1.2 + 8, d.y);
}

// The key note on the synth's tag: "−1 ½ TON", and the keys when they fit

  return `${sign}${Math.abs(n)} ½ TON${Math.abs(n) > 1 ? 'S' : ''}`;

// ---------- the cats (one per instrument, playing it) ----------

  drums: { fur: '#a9c1ee', cut: BLUE, line: null, head: [0.04, -0.98], body: [0, -0.44, 0.54, 0.58], hr: 0.29 },

  bass: { fur: '#5b7ecb', cut: PAPER, line: PAPER, head: [-0.42, -0.86], body: [-0.36, -0.24, 0.34, 0.62], hr: 0.26 },

    roughRect(s.cx - s.w / 2 + 4, s.cy - s.h / 2 + 4, s.w - 8, s.h - 8, 310 + s.i * 7, 2);
  }
  if (s.track && s.muted) { // muted: a dashed frame
    noFill(); stroke(FADED); strokeWeight(2);
    drawingContext.setLineDash([7, 7]);
    rect(s.cx - s.w / 2 + 3, s.cy - s.h / 2 + 3, s.w - 6, s.h - 6, 4);
    drawingContext.setLineDash([]);
    noStroke();
  }
  push();
  translate(s.cx - sx + Math.sin(frameCount * 0.7) * s.shake * 4, cy);
  scale(1 + s.pulse * 0.08);
  INK = !s.track || s.muted ? FADED : quiet ? DIM : PAPER;
  INK0 = INK; drawCat(s, r, 'back'); INK = INK0;
  drawInstrument(s.inst, r, 100 + s.i * 31);
  INK = PAPER;
  instrumentStars(s, r, on && !s.muted, lv);
  drawCat(s, r, 'front');
  pop();
  if (L.sliders) drawSlider(s, area);
  else s.area = 0;

  let ts = Math.max(12, Math.min(17, s.w * 0.07));
  textAlign(CENTER, CENTER); textStyle(BOLD); textSize(ts);
  const draggingFromHere = drag && drag.moved && drag.from === s;
  if (s.track && !draggingFromHere) {
    const c = cardById(s.track);
    const label = s.muted ? `COUPÉ · ${c.title}` : `${c.title} · ${s.part + 1}`;
    const th = ts * 1.9;
    const tw = Math.min(s.w * 0.98, textWidth(label) + th * 1.6);
    while (textWidth(label) + th * 1.2 > tw && ts > 12) { ts -= 0.5; textSize(ts); }
    const x = s.cx - tw / 2, y = s.cy + s.h / 2 - th;
    fill(s.muted || quiet ? FADED : PAPER); roughRect(x, y, tw, th, 500 + s.i * 11 + c.i, 1.5);
    motif(c.i, x + th * 0.5, y + th / 2, th * 0.3, 700 + c.i * 17);
    fill(BLUE);
    text(label, s.cx + th * 0.3, y + th / 2 - 1);
    if (s.pending) { fill(ORANGE); ellipse(x + tw - 6, y + 6, 6); }
    const notes = [tempoNote(s), keyNote(s)].filter(Boolean);
    if (notes.length) {
      fill(ORANGE); textSize(12);
      let note = notes.join(' · ');
      const kn = keyNote(s);
      if (kn) { // the keys too, when there is room
        const keys = `${eng.byId[s.track].key} → ${eng.byId[spotOf('piano').track].key}`.toUpperCase();
        if (textWidth(note + ' · ' + keys) < s.w - 36) note += ' · ' + keys;
      }
      text(note, s.cx - (L.sliders ? 14 : 0), y - 9);
    }
  } else {
    fill(PAPER);
    drawingContext.globalAlpha = 0.85;
    text(NAMES[s.inst], s.cx, s.cy + s.h / 2 - ts);
    drawingContext.globalAlpha = 1;
  }
}

// The parts of each track on the table, numbered in song order, where they
// are in the song. Parts not offered: faint ticks
function drawStrip() {
  chips.length = 0;
  rowBtns.length = 0;
  if (!eng) return;
  textStyle(BOLD);
  if (!L.lines.length) {
    fill(FADED); textAlign(CENTER, CENTER); textSize(12);
    text('LES PARTIES DU MORCEAU APPARAÎTRONT ICI', width / 2, stripY + 20);
    return;
  }
  let lineY = stripY;
  L.lines.forEach((line) => {
    line.rows.forEach((row, ci) => {
      const colX = pad + ci * (L.colW + 16);
      drawRow(row, colX, colX + L.colW, lineY, line.h);
    });
    lineY += line.h;
  });
}
function drawRow(row, X0, X1, top, h) {
  const id = row.id, parts = partsOf(id), c = cardById(id);
  const cur = spots.find((s) => s.track === id).part;
  const ok = offered(id);
  const ly = top + h / 2 + (row.stagger ? 0 : 8); // the song's line
  // label: motif (and title when there is room)
  const narrow = L.labelW < 60;
  const my = row.stagger ? ly : ly - 8;
  fill(PAPER); roughEllipse(X0 + 13, my, 13, 13, 600 + c.i, 0.8);
  motif(c.i, X0 + 13, my, 8, 700 + c.i * 17);
  const on = spots.filter((s) => s.track === id);
  const allMuted = on.every((s) => s.muted);
  if (!narrow) {
    fill(allMuted ? FADED : PAPER); textAlign(LEFT, CENTER); let ls = 14; textSize(ls);
    while (textWidth(c.title) > L.labelW - 34 && ls > 12) textSize(--ls);
    text(c.title, X0 + 30, my);
  }
  // the instruments playing it: their icons under the title (faded: muted)
  on.forEach((s, i) => {
    push();
    translate(X0 + (narrow ? 13 : 40) + i * 30, my + 21);
    INK = s.muted ? FADED : PAPER;
    drawInstrument(s.inst, 12, 100 + s.i * 31);
    INK = PAPER;
    pop();
  });
  // mute / unmute the song, take it off the table
  [{ kind: 'mute', x: X1 - MIN_TOUCH * 1.5 - 4 }, { kind: 'remove', x: X1 - MIN_TOUCH / 2 }].forEach((b, i) => {
    fill(b.kind === 'mute' && allMuted ? ORANGE : PAPER);
    roughEllipse(b.x, ly, 14, 14, 1340 + c.i * 3 + i, 0.6);
    if (b.kind === 'mute') speakerIcon(b.x, ly, allMuted);
    else { stroke(BLUE); strokeWeight(3); strokeCap(ROUND); line(b.x - 5, ly - 5, b.x + 5, ly + 5); line(b.x - 5, ly + 5, b.x + 5, ly - 5); noStroke(); }
    rowBtns.push({ id, kind: b.kind, x: b.x - MIN_TOUCH / 2, y: ly - MIN_TOUCH / 2, w: MIN_TOUCH, h: MIN_TOUCH });
  });
  const x0 = X0 + L.labelW, x1 = X1 - ROW_BTNS_W;
  const dur = Math.max(...parts.map((p) => p.end)) * 1.03;
  const sx = (tm) => x0 + (tm / dur) * (x1 - x0);
  fill(FADED); rect(x0, ly - 1, x1 - x0, 2);
  // the parts: chips, near their place, never closer than a finger
  const cw = 40, pitch = MIN_TOUCH + 2;
  const place = (ks) => {
    const xs = ks.map((k) => Math.min(Math.max((sx(parts[k].start) + sx(parts[k].end)) / 2, x0 + cw / 2), x1 - cw / 2));
    for (let i = 1; i < xs.length; i++) xs[i] = Math.max(xs[i], xs[i - 1] + pitch);
    const n = xs.length;
    if (n && xs[n - 1] > x1 - cw / 2) {
      xs[n - 1] = x1 - cw / 2;
      for (let i = n - 2; i >= 0; i--) xs[i] = Math.min(xs[i], xs[i + 1] - pitch);
    }
    return xs;
  };
  const lanes = row.stagger ? [ok.filter((_, i) => i % 2 === 0), ok.filter((_, i) => i % 2 === 1)] : [ok];
  const voice = spots.find((s) => s.track === id && s.voice && s.voice.ready)?.voice;
  lanes.forEach((ks, lane) => {
    const xs = place(ks);
    const up = !row.stagger || lane === 0;
    const cy = up ? ly - 22 : ly + 22; // chip centre
    ks.forEach((k, i) => {
      const p = parts[k], isCur = k === cur;
      const a = sx(p.start), b = Math.max(sx(p.end), a + 3);
      fill(isCur ? ORANGE : PAPER); rect(a, ly - 3, b - a, 6);
      stroke(isCur ? ORANGE : FADED); strokeWeight(1);
      line(xs[i], up ? cy + 13 : cy - 13, (a + b) / 2, up ? ly - 3 : ly + 3);
      noStroke();
      fill(isCur ? ORANGE : PAPER);
      roughRect(xs[i] - cw / 2, cy - 13, cw, 26, 800 + k * 5 + c.i, 1);
      fill(BLUE); textAlign(CENTER, CENTER); textSize(14);
      text(String(k + 1), xs[i] + (p.all ? 5 : 0), cy - 1);
      if (p.all) { fill(isCur ? BLUE : ORANGE); star(xs[i] - cw / 2 + 9, cy - 1, 5.5, 60 + k); }
      // the touch target: 44 × 44 around the chip, away from the line
      chips.push({ id, k, x: xs[i] - MIN_TOUCH / 2, y: up ? cy + 13 - MIN_TOUCH : cy - 13, w: MIN_TOUCH, h: MIN_TOUCH });
      if (isCur && voice && running) {
        const pos = voice.position();
        if (pos != null) {
          const f = pos / (p.loop_end / voice.rate);
          fill(PAPER); rect(a + (b - a) * f - 1, ly - 6, 3, 12);
        }
      }
    });
  });
}

// A loudspeaker, crossed out when muted (blue on a paper button)
function speakerIcon(x, y, muted) {
  fill(BLUE); noStroke();
  rect(x - 7, y - 3, 4, 6);
  triangle(x - 4, y - 3, x + 1, y - 7, x + 1, y + 7);
  rect(x - 4, y - 3, 5, 6);
  noFill(); stroke(BLUE); strokeWeight(2); strokeCap(ROUND);
  if (muted) { line(x + 3, y - 4, x + 8, y + 4); line(x + 3, y + 4, x + 8, y - 4); }
  else { arc(x + 2, y, 8, 9, -0.9, 0.9); arc(x + 2, y, 14, 15, -0.9, 0.9); }
  noStroke();
}

function drawCard(c, x, y, w, h, rot, lifted) {
  push();
  translate(x + w / 2, y + h / 2);
  rotate(rot || 0);
  if (lifted) { fill(0, 0, 0, 50); roughRect(-w / 2 + 5, -h / 2 + 7, w, h, c.i * 13 + 2, 2); }
  fill(PAPER);
  roughRect(-w / 2, -h / 2, w, h, c.i * 13, Math.max(1.2, w * 0.022));
  const flat = h < w * 0.95; // short cards: a smaller motif
  motif(c.i, 0, -h * 0.12, Math.min(w, h) * (flat ? 0.22 : 0.27), 700 + c.i * 17);
  fill(BLUE); textAlign(CENTER, CENTER); textStyle(BOLD);
  let ts = Math.max(12, Math.min(h * 0.15, w * 0.2));
  textSize(ts);
  while (textWidth(c.title) > w * 0.92 && ts > 12) { ts -= 0.5; textSize(ts); }
  if (textWidth(c.title) > w * 0.96) { ts = 11; textSize(ts); }
  text(c.title, 0, h * 0.33);
  const on = spots.filter((s) => s.track === c.id);
  if (on.length) {
    fill(ORANGE);
    star(w / 2 - w * 0.13, -h / 2 + Math.min(w, h) * 0.14, Math.min(w, h) * 0.09, 40 + c.i);
  }
  pop();
}

// ---------- pointer (mouse and touch) ----------
function pos(e) {
  const r = e.target.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function cardAt(x, y) {
  for (let i = cards.length - 1; i >= 0; i--) {
    const c = cards[i];
    if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) return c;
  }
  return null;
}
function spotAt(x, y) {
  return spots.find((s) => Math.abs(x - s.cx) <= s.w / 2 && Math.abs(y - s.cy) <= s.h / 2) || null;
}
const chipAt = (x, y) => chips.find((c) => x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) || null;
const onButton = (b, x, y) => dist(x, y, b.x, b.y) <= Math.max(b.r + 6, MIN_TOUCH / 2);

function down(e) {
  if (!eng) return;
  // The tap that started the tile (on the site's still) may arrive here as
  // a late click once the frame is in place: ignore the first half second,
  // or it would replace a loaded combination
  if (millis() < 500) return;
  const { x, y } = pos(e);
  if (!started) { started = true; hint = HINT1; }
  eng.unlock();
  if (onButton(buttons.play, x, y)) { drag = { kind: 'play' }; return; }
  if (onButton(buttons.dice, x, y)) { drag = { kind: 'dice' }; return; }
  const kp = buttons.keep;
  if (kp && x >= kp.x && x <= kp.x + kp.w && y >= kp.y && y <= kp.y + kp.h) { drag = { kind: 'keep' }; return; }
  if (L.compact) { // the ‹ › under an instrument
    for (const s of spots) {
      if (!s.track || !s.arrows) continue;
      const a = s.arrows.find((r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h);
      if (a) { drag = { kind: 'arrow', s, dir: a.dir }; return; }
    }
  }
  const tb = buttons.tempo, kb = buttons.key;
  if (x >= tb.x && x <= tb.x + tb.w && y >= tb.y && y <= tb.y + tb.h) { drag = { kind: 'tempo' }; return; }
  if (x >= kb.x && x <= kb.x + kb.w && y >= kb.y && y <= kb.y + kb.h) { drag = { kind: 'key' }; return; }
  const sl = sliderAt(x, y);
  if (sl) {
    const now = millis();
    if (lastSliderTap.s === sl && now - lastSliderTap.t < 380) {
      lastSliderTap = { s: null, t: 0 };
      sl.vol = 1;
      if (sl.voice) sl.voice.setGain(gainOf(sl), 0.05);
      say(`${NAMES[sl.inst]} : volume normal`);
      return;
    }
    lastSliderTap = { s: sl, t: now };
    drag = { kind: 'slider', s: sl };
    setVol(sl, y);
    e.target.setPointerCapture(e.pointerId);
    return;
  }
  const rb = rowBtns.find((b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
  if (rb) { drag = { kind: 'row', btn: rb }; return; }
  const ch = chipAt(x, y);
  if (ch) { drag = { kind: 'chip', chip: ch }; return; }
  const c = cardAt(x, y);
  const s = !c && spotAt(x, y);
  if (c) drag = { card: c, from: null, sx: x, sy: y, x, y, moved: false, offx: x - c.x, offy: y - c.y };
  else if (s && s.track) {
    const cc = cardById(s.track);
    drag = { card: cc, from: s, sx: x, sy: y, x, y, moved: false, offx: cc.w / 2, offy: cc.h / 2 };
  } else if (s) {
    s.shake = 1;
    say(`Glissez une carte sur ${ARTICLE[s.inst]}`);
  }
  if (drag) e.target.setPointerCapture(e.pointerId);
}
function move(e) {
  if (drag && drag.kind === 'slider') return setVol(drag.s, pos(e).y);
  if (!drag || !drag.card) return;
  const { x, y } = pos(e);
  drag.x = x; drag.y = y;
  if (!drag.moved && Math.hypot(x - drag.sx, y - drag.sy) > 8) {
    drag.moved = true;
    const pt = eng.part(drag.card.id, defaultPart(drag.card.id));
    if (pt) eng.preload(Object.values(pt));
  }
}
function up(e) {
  if (!drag) return;
  const d = drag;
  drag = null;
  if (d.kind === 'slider') return;
  if (d.kind === 'play') return mainButton();
  if (d.kind === 'keep') return openKeep();
  if (d.kind === 'arrow') return stepPart(d.s, d.dir);
  if (d.kind === 'dice') { hatPop = millis(); return randomTable(); }
  if (d.kind === 'tempo') return toggleAlign();
  if (d.kind === 'key') return toggleKey();
  if (d.kind === 'row') return d.btn.kind === 'mute' ? toggleRow(d.btn.id) : removeRow(d.btn.id);
  if (d.kind === 'chip') {
    const { id, k } = d.chip;
    say(`${eng.byId[id].title} : partie ${k + 1}`);
    return choosePart(id, k);
  }
  const { x, y } = pos(e);
  if (!d.moved) {
    if (d.from) return toggle(d.from);
    if (L.compact) return tapToken(d.card.id);
    const now = millis();
    if (lastTap.id === d.card.id && now - lastTap.t < 380) { lastTap = { id: null, t: 0 }; return wholeTrack(d.card.id); }
    lastTap = { id: d.card.id, t: now };
    d.card.shake = 1;
    say('Glissez la carte sur un instrument · double-clic : tout le morceau');
    return;
  }
  const target = spotAt(x, y);
  if (target && target === d.from) return;
  if (target && accepts(target, d.card.id)) {
    if (d.from) silence(d.from);
    drop(target, d.card.id);
    return;
  }
  if (target) say(`${eng.byId[d.card.id].title} n'a pas de ${NAMES[target.inst].toLowerCase()}`);
  if (d.from && !target) silence(d.from);
  anims.push({ card: d.card, x: x - d.offx, y: y - d.offy, t: 0 });
}
</script>
