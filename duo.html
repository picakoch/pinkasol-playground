<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remix Pinkasol !</title>
<style>
  html, body { margin: 0; height: 100%; background: #174596; overflow: hidden; }
  canvas { display: block; touch-action: none; }
  #back { position: absolute; top: 12px; left: 12px; z-index: 2; color: #fdfdfd; text-decoration: none;
    font: 800 15px/1 "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
  #back:hover { color: #dc8d4e; }
  /* the "Garder" panel: a sheet of paper over the table */
  #keep { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: rgba(23, 69, 150, .6); }
  #keep[hidden] { display: none; }
  #keep .paper { box-sizing: border-box; width: min(460px, calc(100vw - 20px)); max-height: calc(100vh - 20px); overflow: auto; background: #fdfdfd; color: #174596; padding: 18px 18px 16px;
    clip-path: polygon(1% 2%, 30% 0, 62% 1.5%, 99% 0, 100% 35%, 98.5% 70%, 100% 99%, 64% 100%, 33% 98.5%, 0 100%, 1.5% 62%, 0 28%);
    font: 700 15px/1.3 "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif; }
  #keep h2 { margin: 0 0 8px; font-size: 20px; letter-spacing: .05em; }
  #keep h2 span { color: #dc8d4e; }
  #keep .mix { margin: 0 0 10px; font-weight: 600; }
  #keep .code { margin: 0 0 10px; padding: 8px 10px; background: #e6edf9; font: 600 16px/1.35 ui-monospace, Menlo, Consolas, monospace; word-break: break-all;
    user-select: all; -webkit-user-select: all; }
  #keep .msg { margin: 0 0 10px; min-height: 1.3em; }
  #keep .row { display: flex; gap: 10px; flex-wrap: wrap; }
  #keep button { min-height: 44px; padding: 0 16px; border: 0; background: #174596; color: #fdfdfd; font: inherit; letter-spacing: .04em; cursor: pointer; }
  #keep button.light { background: #7f97c7; }
</style>
<script src="/lib/p5.min.js"></script>
<script src="/lib/pinkasol-engine.js"></script>
</head>
<body>
<a id="back" href="/">← Pinkasol</a>
<div id="keep" hidden>
  <div class="paper" role="dialog" aria-label="Votre combinaison">
    <h2><span>♥</span> VOTRE COMBINAISON</h2>
    <p class="mix" id="keep-mix"></p>
    <p class="code" id="keep-code"></p>
    <p class="msg" id="keep-msg"></p>
    <div class="row"><button id="keep-share" type="button">PARTAGER PAR E-MAIL</button><button id="keep-close" class="light" type="button">FERMER</button></div>
  </div>
</div>
<script>
// La table du duo — the tracks are cards. Drop one on an instrument: that
// instrument plays its stem of a PART of the track (a passage cut on bars,
// the same bars for every stem). Each instrument has its own part, even on
// the same song (owner, 2026-11-24); all start together on the same sample.
// Double-click a song: all of it on the table (a random part); again: its
// next part. The strip under the instruments: one row per instrument, its
// song's parts where they are in the song; click one: that instrument only.
// Click an instrument: mute / unmute it. The big button: stop / play the
// table as it is (or the space bar). The die: a random table. Only clicks
// and drags (mouse and touch). Parts are numbered in song order. The strip:
// one row per instrument, always there (greyed when empty or muted): its
// song's parts to choose from, a mute button, and a card dropped on it goes
// to that instrument (owner, 2026-11-24).
const BLUE = '#174596', PAPER = '#fdfdfd', ORANGE = '#dc8d4e', FADED = '#7f97c7', DIM = '#b9c6e2';
const GREY_A = 0.71; // PAPER at this alpha over BLUE ≈ DIM
let INK = PAPER, INK0 = PAPER; // the instruments' paper: faded while silent or muted
// p5 wraps the name in quotes: close and reopen them to pass a fallback list
const FONT = 'Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif, "x';
// Left to right: the drums first (owner, 2026-11-22)
const INSTS = ['drums', 'piano', 'synth', 'bass'];
const NAMES = { piano: 'PIANO', drums: 'BATTERIE', synth: 'SYNTHÉ', bass: 'BASSE' };
const ARTICLE = { piano: 'le piano', drums: 'la batterie', synth: 'le synthé', bass: 'la basse' };
const DEFAULT_TRACK = '08_Pinkasol';
const HINT0 = 'Cliquez, glissez — le son arrive au premier geste';
const HINT1 = 'Glissez une carte sur un instrument · touchez-le : couper / remettre · double-clic : tout le morceau · espace : lecture / arrêt';

let eng = null, loadError = null, started = false;
// Both switches on by default (owner, 2026-11-22): tempo on the drums, the
// synth in the piano's key
let running = false, opSeq = 0, tempoOn = true, keyOn = true;
let hint = HINT0, hintUntil = 0, tempHint = '';
const VOL_MAX = 1.2;
// An instrument's spot by name (never by position: the order can change)
const spotOf = (inst) => spots.find((s) => s.inst === inst);
const spots = INSTS.map((inst, i) => ({ inst, i, track: null, part: 0, muted: false, vol: 1, voice: null, pending: 0,
  cx: 0, cy: 0, w: 0, h: 0, pulse: 0, shake: 0 }));
let cards = [];
let drag = null;
const anims = [];
let lastTap = { id: null, t: 0 };
let hatPop = -1e9; // when the random button was last pressed
const COVER = new Image(); // the Pinkasol cover, for the random button
COVER.src = '/img/cover-medium.webp';
let lastSliderTap = { s: null, t: 0 };
let hintY = 0, stripY = 0, rowH = 40, pad = 10;
const buttons = { play: { x: 0, y: 0, r: 22 }, dice: { x: 0, y: 0, r: 18 }, tempo: { x: 0, y: 0, w: 0, h: 0 }, key: { x: 0, y: 0, w: 0, h: 0 } };
let chips = []; // the strip's clickable parts, rebuilt each frame
const rowBtns = []; // the strip rows' mute buttons, rebuilt each frame
const rowRects = []; // the strip rows (drop targets), rebuilt each frame
window.chips = chips;
window.rowBtns = rowBtns;

// ---------- rough, hand-cut shapes ----------
function jit(seed, i, amp) {
  return [(noise(seed + i * 0.37, 1.3) - 0.5) * 2 * amp, (noise(seed + i * 0.37, 7.1) - 0.5) * 2 * amp];
}
function roughShape(pts, seed, amp) {
  beginShape();
  let idx = 0;
  const step = Math.max(4, amp * 4);
  for (let i = 0; i < pts.length; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % pts.length];
    const k = Math.max(1, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / step));
    for (let j = 0; j < k; j++) {
      const [dx, dy] = jit(seed, idx++, amp);
      vertex(x1 + (x2 - x1) * j / k + dx, y1 + (y2 - y1) * j / k + dy);
    }
  }
  endShape(CLOSE);
}
function roughRect(x, y, w, h, seed, amp) {
  roughShape([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], seed, amp);
}
function roughEllipse(cx, cy, rx, ry, seed, amp, a0 = 0, a1 = TWO_PI) {
  const n = Math.max(14, Math.floor((a1 - a0) * Math.max(rx, ry) / Math.max(3, amp * 3)));
  const full = a1 - a0 >= TWO_PI - 1e-6;
  beginShape();
  for (let i = 0; i <= (full ? n - 1 : n); i++) {
    const a = a0 + (a1 - a0) * i / n;
    const d = (noise(seed + i * 0.41, 3.7) - 0.5) * 2 * amp;
    vertex(cx + Math.cos(a) * (rx + d), cy + Math.sin(a) * (ry + d));
  }
  endShape(CLOSE);
}
function star(x, y, R, seed, arms = 6) {
  const pts = [];
  for (let i = 0; i < arms * 2; i++) {
    const a = -HALF_PI + i * PI / arms + (noise(seed + i, 2.2) - 0.5) * 0.25;
    const r = (i % 2 ? R * 0.34 : R * (0.85 + noise(seed + i, 5.5) * 0.3));
    pts.push([x + Math.cos(a) * r, y + Math.sin(a) * r]);
  }
  beginShape(); pts.forEach(([a, b]) => vertex(a, b)); endShape(CLOSE);
}

// ---------- instruments (linocut silhouettes, unit r) ----------
function keys(x, y, w, h, n, seed, amp) {
  fill(BLUE); roughRect(x, y, w, h, seed, amp);
  const kw = w / n;
  fill(INK);
  for (let i = 0; i < n; i++) roughRect(x + i * kw + kw * 0.14, y + h * 0.1, kw * 0.72, h * 0.8, seed + 50 + i * 3, amp * 0.4);
  fill(BLUE);
  const pattern = [1, 1, 0, 1, 1, 1, 0];
  for (let i = 0; i < n - 1; i++) if (pattern[i % 7]) rect(x + (i + 1) * kw - kw * 0.22, y + h * 0.1, kw * 0.44, h * 0.48);
}
function drawInstrument(inst, r, seed) {
  const a = Math.max(0.8, r * 0.025);
  noStroke();
  if (inst === 'piano') {
    fill(INK);
    roughShape([[-0.95 * r, -0.62 * r], [0.95 * r, -0.62 * r], [0.95 * r, 0.42 * r], [-0.95 * r, 0.42 * r]], seed, a);
    roughRect(-0.86 * r, 0.38 * r, 0.13 * r, 0.42 * r, seed + 9, a);
    roughRect(0.73 * r, 0.38 * r, 0.13 * r, 0.42 * r, seed + 11, a);
    fill(BLUE);
    roughRect(-0.8 * r, -0.5 * r, 1.6 * r, 0.07 * r, seed + 3, a * 0.6);
    roughRect(-0.35 * r, -0.36 * r, 0.7 * r, 0.22 * r, seed + 5, a * 0.6);
    keys(-0.86 * r, 0.0 * r, 1.72 * r, 0.32 * r, 14, seed + 20, a);
  } else if (inst === 'drums') {
    fill(INK);
    roughRect(-0.79 * r, -0.7 * r, 0.045 * r, 1.5 * r, seed + 1, a * 0.5);
    roughRect(0.76 * r, -0.66 * r, 0.045 * r, 1.46 * r, seed + 2, a * 0.5);
    roughEllipse(-0.77 * r, -0.72 * r, 0.3 * r, 0.065 * r, seed + 3, a * 0.6);
    roughEllipse(0.78 * r, -0.68 * r, 0.26 * r, 0.06 * r, seed + 4, a * 0.6);
    roughEllipse(-0.42 * r, -0.28 * r, 0.24 * r, 0.21 * r, seed + 5, a);
    roughEllipse(0.4 * r, -0.3 * r, 0.22 * r, 0.19 * r, seed + 6, a);
    roughEllipse(0.66 * r, 0.18 * r, 0.22 * r, 0.1 * r, seed + 7, a);
    roughEllipse(0, 0.3 * r, 0.47 * r, 0.47 * r, seed + 8, a);
    fill(BLUE);
    roughEllipse(-0.42 * r, -0.28 * r, 0.14 * r, 0.12 * r, seed + 9, a * 0.6);
    roughEllipse(0.4 * r, -0.3 * r, 0.12 * r, 0.1 * r, seed + 10, a * 0.6);
    roughEllipse(0, 0.3 * r, 0.33 * r, 0.33 * r, seed + 11, a * 0.8);
    fill(INK);
    roughEllipse(0, 0.3 * r, 0.11 * r, 0.11 * r, seed + 12, a * 0.5);
  } else if (inst === 'synth') {
    // narrower than the piano, fewer keys, a few knobs and faders (owner,
    // 2026-11-22): the two read apart
    fill(INK);
    roughShape([[-0.8 * r, -0.22 * r], [0.8 * r, -0.42 * r], [0.8 * r, 0.42 * r], [-0.8 * r, 0.42 * r]], seed, a);
    fill(BLUE);
    // 4 knobs, each with its notch
    for (let i = 0; i < 4; i++) {
      const kx = (-0.62 + i * 0.19) * r, ky = (-0.1 - i * 0.022) * r;
      roughEllipse(kx, ky, 0.075 * r, 0.075 * r, seed + 30 + i, a * 0.4);
      push(); fill(INK); translate(kx, ky); rotate(-0.9 + i * 0.55);
      rect(-0.012 * r, -0.07 * r, 0.024 * r, 0.045 * r);
      pop();
    }
    // 4 faders: slots and their caps
    const caps = [0.35, 0.65, 0.2, 0.5];
    for (let i = 0; i < 4; i++) {
      const fx = (0.18 + i * 0.15) * r, top = (-0.33 + i * 0.012) * r, h = 0.27 * r;
      rect(fx - 0.014 * r, top, 0.028 * r, h);
      roughRect(fx - 0.05 * r, top + caps[i] * h - 0.025 * r, 0.1 * r, 0.05 * r, seed + 40 + i, a * 0.3);
    }
    keys(-0.74 * r, 0.06 * r, 1.48 * r, 0.3 * r, 12, seed + 60, a);
  } else if (inst === 'bass') {
    push();
    rotate(-0.62);
    fill(INK);
    roughRect(-0.2 * r, -0.055 * r, 1.08 * r, 0.11 * r, seed + 1, a * 0.6);
    roughShape([[0.86 * r, -0.1 * r], [1.1 * r, -0.13 * r], [1.1 * r, 0.12 * r], [0.86 * r, 0.1 * r]], seed + 2, a * 0.6);
    roughEllipse(-0.6 * r, 0.06 * r, 0.36 * r, 0.3 * r, seed + 3, a);
    roughEllipse(-0.26 * r, -0.02 * r, 0.25 * r, 0.21 * r, seed + 4, a);
    fill(BLUE);
    roughRect(-0.62 * r, -0.13 * r, 0.07 * r, 0.26 * r, seed + 5, a * 0.4);
    roughRect(-0.42 * r, -0.12 * r, 0.06 * r, 0.24 * r, seed + 6, a * 0.4);
    stroke(BLUE); strokeWeight(Math.max(0.7, r * 0.012));
    for (let k = -1.5; k <= 1.5; k++) line(-0.78 * r, k * 0.022 * r, 1.0 * r, k * 0.022 * r);
    noStroke();
    pop();
  }
}

// ---------- the ten motifs (cover vocabulary), in blue on a card ----------
function motif(k, x, y, r, seed) {
  const a = Math.max(0.6, r * 0.04);
  noStroke(); fill(BLUE);
  // Pinkasol (the 8th song): the album's own face, cut out of the cover
  // (owner, 2026-11-22); its three dots while the cover loads
  if (k % 10 === 7 && COVER.complete && COVER.naturalWidth) {
    const ctx2 = drawingContext, w = COVER.naturalWidth, h = COVER.naturalHeight, d = r * 1.9;
    ctx2.save();
    ctx2.beginPath(); ctx2.arc(x, y, d / 2, 0, Math.PI * 2); ctx2.clip();
    ctx2.drawImage(COVER, w * 0.22, h * 0.03, w * 0.5, h * 0.48, x - d / 2, y - d / 2, d, d);
    ctx2.restore();
    return;
  }
  switch (k % 10) {
    case 0: // an eye with lashes
      roughEllipse(x, y + r * 0.1, r * 0.62, r * 0.5, seed, a);
      fill(PAPER); roughEllipse(x, y + r * 0.1, r * 0.3, r * 0.26, seed + 1, a * 0.6);
      fill(BLUE); roughEllipse(x, y + r * 0.16, r * 0.12, r * 0.12, seed + 2, a * 0.4);
      for (let i = -1; i <= 1; i++) roughRect(x + i * r * 0.3 - r * 0.05, y - r * 0.72, r * 0.1, r * 0.26, seed + 3 + i, a * 0.5);
      break;
    case 1: // a half-moon
      roughEllipse(x - r * 0.25, y, r * 0.75, r * 0.75, seed, a, -HALF_PI, HALF_PI);
      break;
    case 2: // a star
      star(x, y, r * 0.85, seed);
      break;
    case 3: // a tree
      roughRect(x - r * 0.08, y - r * 0.2, r * 0.16, r * 0.9, seed, a * 0.6);
      roughShape([[x - r * 0.7, y - r * 0.8], [x - r * 0.52, y - r * 0.85], [x, y - r * 0.1], [x + r * 0.52, y - r * 0.85], [x + r * 0.7, y - r * 0.8], [x + r * 0.1, y + r * 0.1], [x - r * 0.1, y + r * 0.1]], seed + 1, a * 0.6);
      break;
    case 4: // a sun
      roughEllipse(x, y, r * 0.42, r * 0.42, seed, a);
      for (let i = 0; i < 9; i++) {
        const t = i / 9 * TWO_PI, c = Math.cos(t), s = Math.sin(t);
        roughShape([[x + c * r * 0.55 - s * r * 0.08, y + s * r * 0.55 + c * r * 0.08], [x + c * r * 0.95, y + s * r * 0.95], [x + c * r * 0.55 + s * r * 0.08, y + s * r * 0.55 - c * r * 0.08]], seed + 2 + i, a * 0.3);
      }
      break;
    case 5: // waves
      for (let j = 0; j < 3; j++) {
        const pts = [];
        for (let i = 0; i <= 12; i++) pts.push([x - r * 0.85 + i * r * 0.142, y + (j - 1) * r * 0.48 + Math.sin(i * 1.1 + j) * r * 0.1]);
        for (let i = 12; i >= 0; i--) pts.push([x - r * 0.85 + i * r * 0.142, y + (j - 1) * r * 0.48 + Math.sin(i * 1.1 + j) * r * 0.1 + r * 0.18]);
        roughShape(pts, seed + j * 9, a * 0.4);
      }
      break;
    case 6: // two hills
      roughShape([[x - r * 0.95, y + r * 0.6], [x - r * 0.35, y - r * 0.55], [x + r * 0.2, y + r * 0.6]], seed, a);
      roughShape([[x - r * 0.1, y + r * 0.6], [x + r * 0.45, y - r * 0.2], [x + r * 0.95, y + r * 0.6]], seed + 1, a);
      break;
    case 7: // three dots
      roughEllipse(x - r * 0.55, y + r * 0.2, r * 0.26, r * 0.26, seed, a);
      roughEllipse(x + r * 0.05, y - r * 0.3, r * 0.3, r * 0.3, seed + 1, a);
      roughEllipse(x + r * 0.55, y + r * 0.35, r * 0.2, r * 0.2, seed + 2, a);
      break;
    case 8: // a crescent
      roughEllipse(x, y, r * 0.75, r * 0.75, seed, a);
      fill(PAPER); roughEllipse(x + r * 0.32, y - r * 0.18, r * 0.6, r * 0.6, seed + 1, a);
      break;
    case 9: // a fish
      roughEllipse(x - r * 0.12, y, r * 0.6, r * 0.34, seed, a);
      roughShape([[x + r * 0.4, y], [x + r * 0.92, y - r * 0.38], [x + r * 0.86, y + r * 0.38]], seed + 1, a * 0.6);
      fill(PAPER); roughEllipse(x - r * 0.45, y - r * 0.06, r * 0.07, r * 0.07, seed + 2, a * 0.3);
      break;
  }
}

// ---------- the table's state ----------
const occupied = () => spots.filter((s) => s.track);
const cardById = (id) => cards.find((c) => c.id === id);
const partsOf = (id) => eng.byId[id].parts || [];
const stemsOf = (id) => Object.keys(eng.part(id, 0) || {});
const instsOn = (id) => spots.filter((s) => s.track === id).map((s) => s.inst);
const accepts = (s, track) => !!(eng && stemsOf(track).includes(s.inst));
function pieceFor(s) {
  const pt = eng.part(s.track, s.part);
  const p = pt ? pt[s.inst] : null;
  const n = s.inst === 'synth' ? synthShift() : 0;
  return p && n ? { ...p, semitones: n } : p;
}
// The key switch: the synth (only it) moved to the piano's key, in semitones
function synthShift() {
  const piano = spotOf('piano').track, synth = spotOf('synth').track;
  if (!keyOn || !piano || !synth || piano === synth) return 0;
  return eng.keyShift(eng.byId[synth].key, eng.byId[piano].key);
}
const plays = (id, k, inst) => !!partsOf(id)[k]?.playing.includes(inst);

// The parts of a song (all of them: a double-click goes through every one)
const offered = (id) => partsOf(id).map((_, k) => k);
// The parts an instrument's row offers: only those where it really plays
// (owner, 2026-11-24: no silent loops on a row); all if it never does
function offeredFor(s, id = s.track) {
  const ks = offered(id).filter((k) => plays(id, k, s.inst));
  return ks.length ? ks : offered(id);
}
// Double-click: the first `all` part, else the fullest
function defaultPart(id) {
  const parts = partsOf(id);
  const all = parts.findIndex((p) => p.all);
  if (all >= 0) return all;
  let best = 0;
  parts.forEach((p, i) => { if (p.playing.length > parts[best].playing.length) best = i; });
  return best;
}
const setPart = (id, k) => spots.forEach((s) => { if (s.track === id) s.part = k; });

// Start these spots together (same sample: next bar, or now); their old
// voices and `extra` stop at that moment. A newer operation on a spot wins
// `now`: the whole table right away (a fresh clock, the old voices fade in
// 30 ms); else on the next bar of the running clock
async function launch(list, extra = [], now = false) {
  const id = ++opSeq;
  if (presetPending) { presetPending = false; hint = HINT1; }
  // the drums first: with the tempo switch on, the first piece leads
  list = list.filter((s) => s.track).sort((a, b) => (b.inst === 'drums') - (a.inst === 'drums'));
  list.forEach((s) => { s.pending = id; });
  const owners = [], pieces = [];
  for (const s of list) { const p = pieceFor(s); if (p) { owners.push(s); pieces.push(p); } }
  const olds = [...list.map((s) => s.voice), ...extra].filter(Boolean);
  list.forEach((s) => { s.voice = null; });
  let vs;
  try { vs = await eng.playTogether(pieces, { immediate: now }, olds); } catch (e) { console.error(e); return; }
  owners.forEach((s, i) => {
    const v = vs[i];
    if (s.pending !== id || !running || !s.track || pieceFor(s)?.file !== v.piece.file) { v.stop(0); return; }
    if (s.voice) s.voice.stop(0.1);
    s.voice = v; s.pending = 0;
    v.setGain(gainOf(s), 0.02);
  });
}
// The spot's gain: its slider, or nothing when muted
const gainOf = (s) => (s.muted ? 0 : s.vol);
function startTable(extra = []) {
  if (!occupied().length) return;
  running = true;
  // the whole table again, right away: a fresh clock (the drums' when the
  // switch is on), every instrument aligned
  return launch(occupied(), extra, true);
}
const drumsOn = (id) => spotOf('drums').track === id;
function stopTable() {
  running = false;
  opSeq++;
  spots.forEach((s) => { if (s.voice) s.voice.stop(0.3); s.voice = null; s.pending = 0; });
}
function relaunchGroup(id, extra = []) {
  if (!running) return startTable(extra);
  // the drums change while they lead: the whole table follows them
  if (tempoOn && drumsOn(id)) return startTable(extra);
  return launch(spots.filter((s) => s.track === id), extra);
}
function drop(s, id) {
  if (s.track === id) return;
  const old = s.voice;
  s.voice = null;
  const mate = spots.find((x) => x !== s && x.track === id);
  s.track = id; s.muted = false;
  // the mates' part (as recorded) when it plays there, else its first part

  // the tempo: noon = as recorded, left slower, right faster; live while
  // turned (the pitch moves), then on the next bar stretched, pitch kept

  const mid = s.length / 2;

function drawHint() {

function drawTempoSwitch() {

// The key note on the synth's tag: "−1 ½ TON", and the keys when they fit
function keyNote(s) {
  if (s.inst !== 'synth' || !keyOn) return '';
  const n = synthShift();
  if (!n) return '';
  const sign = n > 0 ? '+' : '−';
  return `${sign}${Math.abs(n)} ½ TON${Math.abs(n) > 1 ? 'S' : ''}`;
}

// The tempo note on a tag: "136 → 96" when stretched, "13/4" when it can't follow
function tempoNote(s) {
  if (!tempoOn || !s.voice || !s.voice.ready) return '';
  const clock = eng.clock, tr = eng.byId[s.track];
  if (!clock) return '';
  if (tr.meter !== clock.beats) return `${tr.meter}/4 : SON TEMPO`;
  if (s.voice.stretched && Math.abs(s.voice.stretched - 1) > 0.003) return `${Math.round(tr.tempo)} → ${Math.round(clock.tempo)}`;
  return '';
}

// The cover's orange star, a few around each instrument (unit r: x, y,
// size). Playing: they beat with the clock and swell with the sound; empty
// or muted: faint
// ---------- the cats (one per instrument, playing it) ----------
// Hand-cut cats after the band's covers (not copies): the pianist is black
// with a white face mask, the drummer tall and pale blue, the synth player
// paper-white, the bassist mid-blue. Body and tail behind the instrument,
// head, arms, paws and the stick in front. Units: the instrument's r
const CAT_DARK = '#0d1733';
// Fat cats on the drums and the synth, regular cats on the piano and the
// bass (owner, 2026-11-22)
const CATS = {
  piano: { fur: CAT_DARK, cut: PAPER, line: PAPER, mask: true, head: [0.02, -0.96], body: [0, -0.42, 0.38, 0.6], hr: 0.26 },
  drums: { fur: '#a9c1ee', cut: BLUE, line: null, head: [0.04, -0.98], body: [0, -0.44, 0.54, 0.58], hr: 0.29 },
  synth: { fur: PAPER, cut: BLUE, line: null, head: [-0.14, -0.82], body: [-0.14, -0.3, 0.53, 0.5], hr: 0.29 },
  bass: { fur: '#5b7ecb', cut: PAPER, line: PAPER, head: [-0.42, -0.86], body: [-0.36, -0.24, 0.34, 0.62], hr: 0.26 },
};
// What the cat does now: 'sleep' (no song), 'muted' (paws on its ears),
// 'play', or 'idle' (a song, the table stopped)
function catMode(s) {
  if (!s.track) return 'sleep';
  if (s.muted) return 'muted';
  return running && s.voice ? 'play' : 'idle';
}
function catPen(c, r) {
  if (c.line) { stroke(c.line); strokeWeight(Math.max(0.8, r * 0.018)); } else noStroke();
  fill(c.fur);
}

  // always outlined (cobalt on the light cats): an arm reads over its own fur
  const w = Math.max(2.2, r * 0.1), edge = c.line || BLUE;
  stroke(edge); strokeWeight(w + Math.max(1.6, r * 0.036)); line(x1 * r, y1 * r, x2 * r, y2 * r);
  stroke(c.fur); strokeWeight(w); line(x1 * r, y1 * r, x2 * r, y2 * r);

function drawCat(s, r, layer) {

  const ph = mode === 'play' && eng ? eng.phase() : null;
  const beat = ph ? ph.beat : 0, one = ph && ph.n === 0;

    noStroke();

      limb(c, r, -0.26, -0.6, -0.36, 0.06 - lift(0));
      limb(c, r, 0.26, -0.6, 0.38, 0.06 - lift(Math.PI));
    } else if (s.inst === 'drums') { // the stick on the beat (harder on 1)

    } else if (s.inst === 'synth') { // nods, a paw on a knob, one on the keys
      hy += Math.pow(1 - beat, 3) * 0.07;
      tilt = Math.sin(t * 0.05) * 0.06;
      limb(c, r, -0.34, -0.48, -0.6 + Math.sin(t * 0.04) * 0.02, -0.12);
      limb(c, r, 0.08, -0.5, 0.32, 0.12 - (0.5 + 0.5 * Math.sin(t * 0.3)) * lv * 0.1);
    } else if (s.inst === 'bass') { // plucks near the body, the other paw on the neck
      const pl = Math.sin(t * 0.55) * (0.02 + lv * 0.06);
      limb(c, r, -0.46, -0.5, -0.24 + pl, 0.18);
      limb(c, r, -0.26, -0.56, 0.3, -0.26);

      synth: [[-0.34, -0.48, -0.5, -0.32]], bass: [[-0.46, -0.5, -0.3, 0.1]] }[s.inst];

function drawCatHead(s, c, r, hx, hy, tilt, mode, lv) {
  const hr = c.hr * r;
  const dark = c.fur === CAT_DARK || c.fur === '#5b7ecb';
  const t = frameCount;
  push();
  translate(hx * r, hy * r);
  rotate(tilt);
  // ears (twitching with the music)
  const tw = mode === 'play' ? lv * 0.12 * Math.sin(t * 0.4 + s.i) : 0;
  catPen(c, r);
  [-1, 1].forEach((k) => {
    roughShape([[k * hr * 0.2, -hr * 0.6], [k * hr * (0.85 + tw), -hr * (1.45 + tw)], [k * hr * 0.92, -hr * 0.2]], 1200 + s.i * 5 + k, Math.max(0.4, hr * 0.03));
  });
  roughEllipse(0, 0, hr, hr * 0.86, 1210 + s.i * 7, Math.max(0.5, hr * 0.03));
  noStroke();
  fill(c.cut);
  [-1, 1].forEach((k) => triangle(k * hr * 0.36, -hr * 0.62, k * hr * 0.76, -hr * 1.18, k * hr * 0.8, -hr * 0.42));
  if (c.mask) { fill(PAPER); roughEllipse(0, hr * 0.32, hr * 0.66, hr * 0.5, 1220, Math.max(0.4, hr * 0.03)); }
  // eyes: closed asleep, squeezed when muted, wide on loud bits; a blink now and then
  const blink = (t + s.i * 53) % 230 < 6;
  const open = mode === 'sleep' || blink ? 0 : mode === 'muted' ? 0.12 : Math.min(1.25, 0.6 + lv * 0.9);
  const eyeC = dark ? PAPER : BLUE, pupil = dark ? CAT_DARK : PAPER;
  [-1, 1].forEach((k) => {
    const ex = k * hr * 0.38, ey = -hr * 0.08;
    if (open < 0.15) {
      noFill(); stroke(c.mask && false ? CAT_DARK : eyeC); strokeWeight(Math.max(1, hr * 0.08));

    } else {
      fill(eyeC);

  }

    fill(PAPER); drawingContext.globalAlpha = 0.7 * (1 - zt);

const STAR_SPOTS = {
  piano: [[-1.02, -0.72, 0.15], [0.98, -0.9, 0.1], [0.66, -1.22, 0.065]],
  drums: [[-1.0, -0.98, 0.1], [1.04, -0.62, 0.14], [-0.62, -1.32, 0.07]],
  synth: [[-0.98, -0.62, 0.12], [0.94, -0.82, 0.09], [0.55, -1.0, 0.06]],
  bass: [[-1.02, -0.5, 0.12], [-0.52, 0.66, 0.08], [0.98, 0.5, 0.1]],
};
function instrumentStars(s, r, on, lv) {
  const ph = on && eng && eng.phase ? eng.phase() : null;
  const beat = ph ? Math.pow(1 - ph.beat, 3) * (ph.n === 0 ? 1 : 0.55) : 0;
  (STAR_SPOTS[s.inst] || []).forEach(([x, y, k], j) => {
    const R = r * k * (1 + (on ? 0.25 * beat + 0.35 * lv : 0));
    drawingContext.globalAlpha = on ? 1 : 0.38;
    fill(ORANGE);
    push();
    translate(x * r, y * r);
    rotate((on ? beat * 0.25 : 0) * (j % 2 ? 1 : -1) + j * 0.4);
    star(0, 0, R, 900 + s.i * 13 + j * 5);
    pop();
  });
  drawingContext.globalAlpha = 1;
}

// ---------- volume sliders (one per instrument) ----------
// A vertical groove at the spot's right edge, above the tag; orange up to
// the paper knob; a tick at 1 (the default). Drag the knob, tap the groove
// to jump, double-tap to reset
function sliderOf(s, area = s.area) {
  const x = s.cx + s.w / 2 - 16;
  const y0 = s.cy - s.h / 2 + 12, y1 = s.cy - s.h / 2 + area - 4;
  return { x, y0, y1, ky: y1 - (s.vol / VOL_MAX) * (y1 - y0) };
}
function drawSlider(s, area) {
  s.area = area;
  const g = sliderOf(s, area);
  const live = !!s.track;
  drawingContext.globalAlpha = live ? 1 : 0.45;
  fill(s.muted ? FADED : PAPER);
  roughRect(g.x - 4, g.y0, 8, g.y1 - g.y0, 970 + s.i * 7, 0.8);
  if (!s.muted) { fill(ORANGE); roughRect(g.x - 3, g.ky, 6, g.y1 - g.ky, 980 + s.i * 7, 0.6); }
  // the default: a little tick
  const dy = g.y1 - (1 / VOL_MAX) * (g.y1 - g.y0);
  fill(PAPER); rect(g.x - 9, dy - 1, 5, 2); rect(g.x + 4, dy - 1, 5, 2);
  const hot = drag && drag.kind === 'slider' && drag.s === s;
  fill(PAPER);
  roughEllipse(g.x, g.ky, hot ? 11 : 9, hot ? 11 : 9, 990 + s.i * 7, 0.7);
  fill(BLUE); rect(g.x - 4, g.ky - 1, 8, 2);
  drawingContext.globalAlpha = 1;
}
function sliderAt(x, y) {
  if (L.compact || !L.sliders) return null;
  return spots.find((s) => {
    if (!s.area) return false;
    const g = sliderOf(s);
    return Math.abs(x - g.x) <= MIN_TOUCH / 2 && y >= g.y0 - 12 && y <= g.y1 + 12;
  }) || null;
}
function setVol(s, y) {
  const g = sliderOf(s);
  let v = ((g.y1 - y) / (g.y1 - g.y0)) * VOL_MAX;
  v = Math.max(0, Math.min(VOL_MAX, v));
  if (Math.abs(v - 1) < 0.04) v = 1; // a soft notch at the default
  s.vol = v;
  if (s.voice) s.voice.setGain(gainOf(s), 0.05);
}

function drawSpot(s) {
  const tagH = Math.max(12, Math.min(17, s.w * 0.07)) * 1.9;
  const area = s.h - tagH - 14; // above the tag (and its tempo note)
  // the instrument (and its stars) left of the volume slider
  const sx = L.sliders ? 14 : 0; // room for the slider on the right
  const r = Math.min((s.w / 2 - (L.sliders ? 26 : 6)) / 1.1, area * 0.42);
  const on = !!(s.track && running);
  const lv = on && s.voice && s.voice.ready ? s.voice.level() : 0;
  s.pulse = lerp(s.pulse, lv, 0.35);
  s.shake *= 0.88;
  const hovered = drag && drag.moved && spotAt(drag.x, drag.y) === s;
  const ok = hovered && accepts(s, drag.card.id);
  const quiet = s.track && !plays(s.track, s.part, s.inst);
  const cy = s.cy - s.h / 2 + area - 0.86 * r - 4; // the cat's head above

  if (hovered) {
    fill(ok ? ORANGE : 'rgba(253,253,253,0.25)');
    roughRect(s.cx - s.w / 2, s.cy - s.h / 2, s.w, s.h, 300 + s.i * 7, 2);
    fill(BLUE);
    roughRect(s.cx - s.w / 2 + 4, s.cy - s.h / 2 + 4, s.w - 8, s.h - 8, 310 + s.i * 7, 2);
  }
  if (s.track && s.muted) { // muted: a dashed frame
    noFill(); stroke(FADED); strokeWeight(2);
    drawingContext.setLineDash([7, 7]);

    drawingContext.setLineDash([]);
    noStroke();
  }

  translate(s.cx - sx + Math.sin(frameCount * 0.7) * s.shake * 4, cy);
  scale(1 + s.pulse * 0.08);
  INK = !s.track || s.muted ? FADED : quiet ? DIM : PAPER;
  INK0 = INK; drawCat(s, r, 'back'); INK = INK0;
  drawInstrument(s.inst, r, 100 + s.i * 31);
  INK = PAPER;
  instrumentStars(s, r, on && !s.muted, lv);
  drawCat(s, r, 'front');
  pop();
  if (L.sliders) drawSlider(s, area);

  let ts = Math.max(12, Math.min(17, s.w * 0.07));
  textAlign(CENTER, CENTER); textStyle(BOLD); textSize(ts);
  const draggingFromHere = drag && drag.moved && drag.from === s;
  if (s.track && !draggingFromHere) {
    const c = cardById(s.track);
    const label = s.muted ? `COUPÉ · ${c.title}` : `${c.title} · ${s.part + 1}`;
    const th = ts * 1.9;
    const tw = Math.min(s.w * 0.98, textWidth(label) + th * 1.6);
    while (textWidth(label) + th * 1.2 > tw && ts > 12) { ts -= 0.5; textSize(ts); }
    const x = s.cx - tw / 2, y = s.cy + s.h / 2 - th;
    fill(s.muted || quiet ? FADED : PAPER); roughRect(x, y, tw, th, 500 + s.i * 11 + c.i, 1.5);
    motif(c.i, x + th * 0.5, y + th / 2, th * 0.3, 700 + c.i * 17);
    fill(BLUE);
    text(label, s.cx + th * 0.3, y + th / 2 - 1);
    if (s.pending) { fill(ORANGE); ellipse(x + tw - 6, y + 6, 6); }
    const notes = [tempoNote(s), keyNote(s)].filter(Boolean);
    if (notes.length) {
      fill(ORANGE); textSize(12);
      let note = notes.join(' · ');
      const kn = keyNote(s);
      if (kn) { // the keys too, when there is room
        const keys = `${eng.byId[s.track].key} → ${eng.byId[spotOf('piano').track].key}`.toUpperCase();
        if (textWidth(note + ' · ' + keys) < s.w - 36) note += ' · ' + keys;
      }
      text(note, s.cx - (L.sliders ? 14 : 0), y - 9);
    }
  } else {
    fill(PAPER);
    drawingContext.globalAlpha = 0.85;
    text(NAMES[s.inst], s.cx, s.cy + s.h / 2 - ts);
    drawingContext.globalAlpha = 1;
  }
}

// The parts of each track on the table, numbered in song order, where they
// are in the song. Parts not offered: faint ticks
function drawStrip() {
  chips.length = 0;
  rowBtns.length = 0;
  rowRects.length = 0;
  if (!eng) return;
  textStyle(BOLD);
  let lineY = stripY;
  L.lines.forEach((line) => {
    line.rows.forEach((row, ci) => {
      const colX = pad + ci * (L.colW + 16);
      drawRow(row, colX, colX + L.colW, lineY, line.h);
    });
    lineY += line.h;
  });
}
// A row of the strip: one instrument, its song's parts. Greyed when empty
// or muted; a card dropped on it goes to the instrument
function drawRow(row, X0, X1, top, h) {
  const s = row.s, id = s.track;
  rowRects.push({ s, x: X0, y: top, w: X1 - X0, h });
  const ly = top + h / 2 + (row.stagger ? 0 : 8); // the song's line
  const my = row.stagger ? ly : ly - 8;
  const narrow = L.labelW < 60;
  // a card dragged over it: orange when the instrument takes it
  if (drag && drag.moved && drag.card && rowSpotAt(drag.x, drag.y) === s) {
    fill(accepts(s, drag.card.id) ? ORANGE : 'rgba(253,253,253,0.25)');
    roughRect(X0 - 4, top + 1, X1 - X0 + 8, h - 2, 1350 + s.i, 1.5);
    fill(BLUE); roughRect(X0 - 1, top + 4, X1 - X0 + 2, h - 8, 1360 + s.i, 1.5);
  }
  // greyed (empty or muted): paper at GREY_A over the blue is exactly DIM,
  // the grey of a silent loop: one grey for "not heard"
  const grey = !id || s.muted;
  if (grey) drawingContext.globalAlpha = GREY_A;
  // label: the instrument's icon, then the song's title
  instIcon(s.inst, X0 + 16, my, 16);
  const c = id ? cardById(id) : null;
  if (!narrow) {
    const title = c ? c.title : NAMES[s.inst];
    const tx = X0 + 38, room = L.labelW - 38 - 4;
    fill(PAPER); textAlign(LEFT, CENTER); let ls = 14; textSize(ls);
    while (textWidth(title) > room && ls > 10) textSize(--ls);
    text(title, tx, my);
  }
  if (!id) { // empty: an invitation, no parts
    const x0 = X0 + L.labelW, x1 = X1 - ROW_BTNS_W;
    fill(FADED); rect(x0, ly - 1, x1 - x0, 2);
    fill(PAPER); textAlign(CENTER, CENTER); textSize(12);
    text(`GLISSEZ UNE CHANSON ICI OU SUR ${ARTICLE[s.inst].toUpperCase()}`, (x0 + x1) / 2, my);
    drawingContext.globalAlpha = 1;
    return;
  }
  // mute / unmute (never greyed: it brings the row back)
  drawingContext.globalAlpha = 1;
  const bx = X1 - MIN_TOUCH / 2;
  fill(s.muted ? ORANGE : PAPER);
  roughEllipse(bx, ly, 14, 14, 1340 + s.i, 0.6);
  speakerIcon(bx, ly, s.muted);
  rowBtns.push({ s, x: bx - MIN_TOUCH / 2, y: ly - MIN_TOUCH / 2, w: MIN_TOUCH, h: MIN_TOUCH });
  if (grey) drawingContext.globalAlpha = GREY_A;
  const parts = partsOf(id), cur = s.part, ok = offeredFor(s);
  const x0 = X0 + L.labelW, x1 = X1 - ROW_BTNS_W;
  const dur = Math.max(...parts.map((p) => p.end)) * 1.03;
  const sx = (tm) => x0 + (tm / dur) * (x1 - x0);
  fill(FADED); rect(x0, ly - 1, x1 - x0, 2);
  // the parts: chips, near their place, never closer than a finger
  const cw = 40, pitch = MIN_TOUCH + 2;
  const place = (ks) => {
    const xs = ks.map((k) => Math.min(Math.max((sx(parts[k].start) + sx(parts[k].end)) / 2, x0 + cw / 2), x1 - cw / 2));
    for (let i = 1; i < xs.length; i++) xs[i] = Math.max(xs[i], xs[i - 1] + pitch);
    const n = xs.length;
    if (n && xs[n - 1] > x1 - cw / 2) {
      xs[n - 1] = x1 - cw / 2;
      for (let i = n - 2; i >= 0; i--) xs[i] = Math.min(xs[i], xs[i + 1] - pitch);
    }
    return xs;
  };
  const lanes = row.stagger ? [ok.filter((_, i) => i % 2 === 0), ok.filter((_, i) => i % 2 === 1)] : [ok];
  // its own voice only: another instrument on the song may play another part
  const voice = s.voice && s.voice.ready && s.voice.piece.part === cur ? s.voice : null;
  lanes.forEach((ks, lane) => {
    const xs = place(ks);
    const up = !row.stagger || lane === 0;
    const cy = up ? ly - 22 : ly + 22; // chip centre
    ks.forEach((k, i) => {
      const p = parts[k], isCur = k === cur;
      const a = sx(p.start), b = Math.max(sx(p.end), a + 3);
      fill(isCur ? ORANGE : PAPER); rect(a, ly - 3, b - a, 6);
      stroke(isCur ? ORANGE : FADED); strokeWeight(1);
      line(xs[i], up ? cy + 13 : cy - 13, (a + b) / 2, up ? ly - 3 : ly + 3);
      noStroke();
      fill(isCur ? ORANGE : PAPER);
      roughRect(xs[i] - cw / 2, cy - 13, cw, 26, 800 + k * 5 + c.i + s.i * 50, 1);
      fill(BLUE); textAlign(CENTER, CENTER); textSize(14);
      text(String(k + 1), xs[i], cy - 1);
      // the touch target: 44 × 44 around the chip, away from the line
      chips.push({ s, id, k, x: xs[i] - MIN_TOUCH / 2, y: up ? cy + 13 - MIN_TOUCH : cy - 13, w: MIN_TOUCH, h: MIN_TOUCH });
      if (isCur && voice && running) {
        const pos = voice.position();
        if (pos != null) {
          // the loop as played: stretched to the drums' tempo it is longer
          // than p.loop_end (loopLen, in the buffer's seconds)
          const f = Math.min(1, Math.max(0, pos / (voice.loopLen / voice.rate)));
          fill(PAPER); rect(a + (b - a) * f - 1, ly - 6, 3, 12);
        }
      }
    });
  });
  drawingContext.globalAlpha = 1;
}
const rowSpotAt = (x, y) => rowRects.find((r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h)?.s || null;

// An instrument's icon: a round paper badge, a bold blue glyph (the strip's
// rows; the big drawings don't read at this size)
function instIcon(inst, x, y, r) {
  fill(PAPER); roughEllipse(x, y, r, r, 1370 + INSTS.indexOf(inst) * 7, 0.7);
  const u = r / 16; // drawn for r = 16
  push(); translate(x, y); scale(u);
  fill(BLUE); noStroke(); strokeCap(ROUND); strokeJoin(ROUND);
  if (inst === 'drums') {
    ellipse(1, 3, 15, 15); fill(PAPER); ellipse(1, 3, 6, 6); fill(BLUE); // bass drum
    stroke(BLUE); strokeWeight(2.2);
    line(-10, -7, -3, -9); line(-6.5, -8, -6.5, 3); // cymbal on its stand
    line(4, -10, 9, -5); line(9, -10, 4, -5); // crossed sticks
  } else if (inst === 'piano') {
    rect(-11, -7, 22, 14, 1.5); fill(PAPER);
    for (let i = 0; i < 6; i++) rect(-9.6 + i * 3.4, -5.6, 2.6, 11.2, 0.6); // white keys
    fill(BLUE);
    [0, 1, 3, 4].forEach((i) => rect(-7.4 + i * 3.4, -5.6, 1.8, 6.5)); // black keys
  } else if (inst === 'synth') {
    rect(-11, -6, 22, 12, 1.5); fill(PAPER);
    ellipse(-6.5, -1, 4.6, 4.6); ellipse(-1.2, -1, 4.6, 4.6); // knobs
    rect(3.6, -3.8, 1.6, 7.6); rect(7.2, -3.8, 1.6, 7.6); // faders
    rect(2.6, 0, 3.6, 2); rect(6.2, -2.8, 3.6, 2);
  } else if (inst === 'bass') {
    ellipse(-4.5, 5, 10, 9); ellipse(-1.5, 0.5, 7.5, 7); // body
    stroke(BLUE); strokeWeight(2.6); line(-1, 1, 9, -9); // neck
    noStroke(); rect(7.5, -12, 4, 4, 1); // head
    fill(PAPER); ellipse(-3.6, 3.6, 2.6, 2.6); // sound hole
  }
  noStroke();
  pop();
}

// A loudspeaker, crossed out when muted (blue on a paper button)
function speakerIcon(x, y, muted) {
  fill(BLUE); noStroke();
  rect(x - 7, y - 3, 4, 6);
  triangle(x - 4, y - 3, x + 1, y - 7, x + 1, y + 7);
  rect(x - 4, y - 3, 5, 6);
  noFill(); stroke(BLUE); strokeWeight(2); strokeCap(ROUND);
  if (muted) { line(x + 3, y - 4, x + 8, y + 4); line(x + 3, y + 4, x + 8, y - 4); }
  else { arc(x + 2, y, 8, 9, -0.9, 0.9); arc(x + 2, y, 14, 15, -0.9, 0.9); }
  noStroke();
}

function drawCard(c, x, y, w, h, rot, lifted) {
  push();
  translate(x + w / 2, y + h / 2);
  rotate(rot || 0);
  if (lifted) { fill(0, 0, 0, 50); roughRect(-w / 2 + 5, -h / 2 + 7, w, h, c.i * 13 + 2, 2); }
  fill(PAPER);
  roughRect(-w / 2, -h / 2, w, h, c.i * 13, Math.max(1.2, w * 0.022));
  const flat = h < w * 0.95; // short cards: a smaller motif
  motif(c.i, 0, -h * 0.12, Math.min(w, h) * (flat ? 0.22 : 0.27), 700 + c.i * 17);
  fill(BLUE); textAlign(CENTER, CENTER); textStyle(BOLD);
  let ts = Math.max(12, Math.min(h * 0.15, w * 0.2));
  textSize(ts);
  while (textWidth(c.title) > w * 0.92 && ts > 12) { ts -= 0.5; textSize(ts); }
  if (textWidth(c.title) > w * 0.96) { ts = 11; textSize(ts); }
  text(c.title, 0, h * 0.33);
  pop();
}

// ---------- pointer (mouse and touch) ----------
function pos(e) {
  const r = e.target.getBoundingClientRect();
  return { x: (e.clientX - r.left) / U, y: (e.clientY - r.top) / U };
}
function cardAt(x, y) {
  for (let i = cards.length - 1; i >= 0; i--) {
    const c = cards[i];
    if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) return c;
  }
  return null;
}
function spotAt(x, y) {
  return spots.find((s) => Math.abs(x - s.cx) <= s.w / 2 && Math.abs(y - s.cy) <= s.h / 2) || null;
}
const chipAt = (x, y) => chips.find((c) => x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) || null;
const onButton = (b, x, y) => dist(x, y, b.x, b.y) <= Math.max(b.r + 6, MIN_TOUCH / 2);

function down(e) {
  if (!eng) return;
  // The tap that started the tile (on the site's still) may arrive here as
  // a late click once the frame is in place: ignore the first half second,
  // or it would replace a loaded combination
  if (millis() < 500) return;
  const { x, y } = pos(e);
  if (!started) { started = true; hint = HINT1; }
  eng.unlock();
  if (onButton(buttons.play, x, y)) { drag = { kind: 'play' }; return; }
  if (buttons.dice && onButton(buttons.dice, x, y)) { drag = { kind: 'dice' }; return; }
  const rs = buttons.reset;
  if (rs && x >= rs.x && x <= rs.x + rs.w && y >= rs.y && y <= rs.y + rs.h) { drag = { kind: 'reset' }; return; }
  const kn = knobAt(x, y);
  if (kn) {
    const now = millis();
    if (lastKnobTap.k === kn && now - lastKnobTap.t < 380) {
      lastKnobTap = { k: null, t: 0 };
      setKnob(kn, kn.bipolar ? 0.5 : 0);
      if (kn.name === 'tempo' && running) settleTempo();
      say(kn.name === 'tempo' ? 'Tempo d\'origine' : `${kn.label} : coupé`);
      return;
    }
    lastKnobTap = { k: kn, t: now };
    drag = { kind: 'knob', k: kn, x0: x, y0: y, v0: knobPos(kn) };
    e.target.setPointerCapture(e.pointerId);
    return;
  }
  const kp = buttons.keep;
  if (kp && x >= kp.x && x <= kp.x + kp.w && y >= kp.y && y <= kp.y + kp.h) { drag = { kind: 'keep' }; return; }
  if (L.compact) { // the ‹ › under an instrument
    for (const s of spots) {
      if (!s.track || !s.arrows) continue;
      const a = s.arrows.find((r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h);
      if (a) { drag = { kind: 'arrow', s, dir: a.dir }; return; }
    }
  }
  const tb = buttons.tempo, kb = buttons.key;
  if (x >= tb.x && x <= tb.x + tb.w && y >= tb.y && y <= tb.y + tb.h) { drag = { kind: 'tempo' }; return; }
  if (x >= kb.x && x <= kb.x + kb.w && y >= kb.y && y <= kb.y + kb.h) { drag = { kind: 'key' }; return; }
  const sl = sliderAt(x, y);
  if (sl) {
    const now = millis();
    if (lastSliderTap.s === sl && now - lastSliderTap.t < 380) {
      lastSliderTap = { s: null, t: 0 };
      sl.vol = 1;
      if (sl.voice) sl.voice.setGain(gainOf(sl), 0.05);
      say(`${NAMES[sl.inst]} : volume normal`);
      return;
    }
    lastSliderTap = { s: sl, t: now };
    drag = { kind: 'slider', s: sl };
    setVol(sl, y);
    e.target.setPointerCapture(e.pointerId);
    return;
  }
  const rb = rowBtns.find((b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
  if (rb) { drag = { kind: 'mute', s: rb.s }; return; }
  const ch = chipAt(x, y);
  if (ch) { drag = { kind: 'chip', chip: ch }; return; }
  const c = cardAt(x, y);
  const row = !c && !L.compact && rowSpotAt(x, y);
  const s = !c && (spotAt(x, y) || row);
  if (c) drag = { card: c, from: null, sx: x, sy: y, x, y, moved: false, offx: x - c.x, offy: y - c.y };
  else if (s && s.track) {
    const cc = cardById(s.track);
    drag = { card: cc, from: s, fromRow: !!row, sx: x, sy: y, x, y, moved: false, offx: cc.w / 2, offy: cc.h / 2 };
  } else if (s) {
    s.shake = 1;
    say(`Glissez une carte sur ${ARTICLE[s.inst]}`);
  }
  if (drag) e.target.setPointerCapture(e.pointerId);
}
function move(e) {
  if (drag && drag.kind === 'knob') {
    const { x, y } = pos(e);
    return setKnob(drag.k, drag.v0 + ((drag.y0 - y) + (x - drag.x0)) / 140);
  }
  if (drag && drag.kind === 'slider') return setVol(drag.s, pos(e).y);
  if (!drag || !drag.card) return;
  const { x, y } = pos(e);
  drag.x = x; drag.y = y;
  if (!drag.moved && Math.hypot(x - drag.sx, y - drag.sy) > 8) {
    drag.moved = true;
    const pt = eng.part(drag.card.id, defaultPart(drag.card.id));
    if (pt) eng.preload(Object.values(pt));
  }
}
function up(e) {
  if (!drag) return;
  const d = drag;
  drag = null;
  if (d.kind === 'slider') return;
  if (d.kind === 'play') return mainButton();
  if (d.kind === 'keep') return openKeep();
  if (d.kind === 'arrow') return stepPart(d.s, d.dir);
  if (d.kind === 'dice') { hatPop = millis(); return randomTable(); }
  if (d.kind === 'tempo') return toggleAlign();
  if (d.kind === 'key') return toggleKey();
  if (d.kind === 'mute') return toggle(d.s);
  if (d.kind === 'reset') return resetFx();
  if (d.kind === 'knob') {
    // the tempo: the table restarts at its new speed when the knob is let go
    if (d.k.name === 'tempo' && running && knobPos(d.k) !== d.v0) { settleTempo(); say(d.k.onLabel()); }
    return;
  }
  if (d.kind === 'chip') {
    const { s, k } = d.chip;
    say(`${NAMES[s.inst]} : ${eng.byId[s.track].title}, partie ${k + 1}`);
    return spotPart(s, k);
  }
  const { x, y } = pos(e);
  if (!d.moved) {
    if (d.fromRow) return; // a tap on a row: its chips and button do the work
    if (d.from) return toggle(d.from);
    if (L.compact) return tapToken(d.card.id);
    const now = millis();
    if (lastTap.id === d.card.id && now - lastTap.t < 380) { lastTap = { id: null, t: 0 }; return wholeTrack(d.card.id); }
    lastTap = { id: d.card.id, t: now };
    d.card.shake = 1;
    say('Glissez la carte sur un instrument · double-clic : tout le morceau');
    return;
  }
  const target = spotAt(x, y) || (L.compact ? null : rowSpotAt(x, y));
  if (target && target === d.from) return;
  if (target && accepts(target, d.card.id)) {
    if (d.from) silence(d.from);
    drop(target, d.card.id);
    return;
  }
  if (target) say(`${eng.byId[d.card.id].title} n'a pas de ${NAMES[target.inst].toLowerCase()}`);
  if (d.from && !target) silence(d.from);
  anims.push({ card: d.card, x: x - d.offx, y: y - d.offy, t: 0 });
}
</script>
